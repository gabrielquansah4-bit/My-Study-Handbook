const _mshShowProgressBeforeScores=showProgress;
showProgress=function(){_mshShowProgressBeforeScores();const app=document.getElementById('app');const scored=Object.entries(state.quizScores||{}).map(([k,v])=>({x:topicParts(k),v})).filter(a=>topicExists(a.x));const sec=document.createElement('section');sec.className='feature-panel';sec.style.marginTop='20px';sec.innerHTML=`<h3>📝 Practice question results</h3><p>Scores are saved on this device as you answer questions.</p>${scored.length?scored.sort((a,b)=>(b.v.date||'').localeCompare(a.v.date||'')).slice(0,10).map(a=>`<div class="saved-row"><div class="saved-copy"><b>${safeText(a.x.t)}</b><small>${safeText(a.x.c)} · ${safeText(a.x.s)} · ${Number(a.v.answered)||0}/50 answered</small></div><span class="pill">${Number(a.v.correct)||0}/${Number(a.v.answered)||0} correct</span><button class="btn btn-primary" onclick="openTopic(${jsArg(a.x.c)},${jsArg(a.x.s)},${jsArg(a.x.t)})">Practise again</button></div>`).join(''):'<p>No practice scores recorded yet. Open a topic and answer the multiple-choice questions to start tracking them.</p>'}`;app.appendChild(sec);addBackupControls();};


/* Topic-family mini-lessons: add an explanation, worked example and retrieval check to every topic. */
function mshLessonBoost(c,s,t){
 const k=String(t||'').toLowerCase();let title='',idea='',worked='',ask='',answer='';
 const choose=(a)=>{[title,idea,worked,ask,answer]=a;};
 if(s==='Mathematics'){
  if(/fraction|decimal|percent/.test(k))choose(['Connect fractions, decimals and percentages','These are different ways to represent parts of a whole. Percent means “out of 100”; a fraction describes equal parts, while a decimal uses place value.','A 25% discount on GH₵80 is 25/100 × 80 = GH₵20. The new price is GH₵80 − GH₵20 = GH₵60.','A school bag costs GH₵120 and is discounted by 10%. Find the discount and new price.','10% of GH₵120 is GH₵12, so the new price is GH₵120 − GH₵12 = GH₵108.']);
  else if(/ratio|proportion|rate/.test(k))choose(['Compare quantities fairly','A ratio compares quantities; a rate compares quantities with different units; proportion describes a consistent relationship. Use matching units before simplifying.','If 3 notebooks cost GH₵18 at the same unit price, one costs GH₵6 and 5 cost GH₵30.','If 4 oranges cost GH₵12 at the same price each, how much do 7 oranges cost?','One orange costs GH₵3, so 7 cost 7 × GH₵3 = GH₵21.']);
  else if(/algebra|equation|unknown|expression|formula|function|pattern|graph|relation|inequalit/.test(k))choose(['Represent a relationship','Variables stand for values. Expressions describe quantities; equations state that two expressions are equal. Keep both sides balanced when solving.','For x + 7 = 19, subtract 7 from both sides: x = 12. Check: 12 + 7 = 19.','Solve 3x = 24 and check your answer.','Divide both sides by 3: x = 8. Check: 3 × 8 = 24.']);
  else if(/geometry|shape|angle|transform|measurement|perimeter|area|volume|coordinate/.test(k))choose(['Use diagrams, measurements and units','A labelled sketch helps identify known information. Perimeter is distance around a shape, area is surface covered, and volume is space occupied.','A rectangle 8 cm by 3 cm has perimeter 2 × (8 + 3) = 22 cm and area 8 × 3 = 24 cm².','A rectangular garden is 6 m long and 4 m wide. Find its perimeter and area.','Perimeter = 2 × (6 + 4) = 20 m. Area = 6 × 4 = 24 m².']);
  else if(/data|statistics|probability|chance/.test(k))choose(['Use data to support a conclusion','Use clear labels and honest scales. Read whether a problem asks for a comparison, a summary such as the mean, or the likelihood of an outcome.','For 2, 4 and 6, the mean is (2 + 4 + 6) ÷ 3 = 4.','Find the mean of 3, 5, 7 and 9.','(3 + 5 + 7 + 9) ÷ 4 = 24 ÷ 4 = 6.']);
  else if(/money|financial|profit|loss|interest|budget/.test(k))choose(['Make sensible money decisions','Keep cost price, selling price, profit, savings and spending distinct. Profit before other expenses is selling price minus cost price.','An item costs GH₵35 and sells for GH₵48. Profit = GH₵48 − GH₵35 = GH₵13.','An item costs GH₵75 and sells for GH₵90. Find the profit before other expenses.','Profit = GH₵90 − GH₵75 = GH₵15.']);
  else choose(['Plan, solve and check','Translate the problem into a diagram, table, number sentence or sequence of steps. Decide what the answer represents before calculating.','If 6 groups each contain 4 items, the total is 6 × 4 = 24 items. The unit tells the reader what 24 represents.','There are 5 trays with 8 oranges on each tray. How many oranges are there altogether?','5 × 8 = 40 oranges.']);
 }else if(s==='Science'){
  if(/matter|material|mixture|substance|element|compound/.test(k))choose(['Describe materials by their properties','Classify materials using observable or measurable properties such as state, hardness, transparency, magnetism or solubility. Apply the same sorting rule consistently.','A paper clip is usually attracted to a magnet, while a wooden stick is not. This observation helps compare magnetic response; not every metal behaves identically.','Name one property that could sort classroom objects into two groups.','Examples include magnetism, transparency, flexibility or solubility. State the property and the rule used to sort.']);
  else if(/cycle|water|earth|space|weather|season|sun|moon|solar/.test(k))choose(['Look for patterns and linked stages','A cycle is understood by naming its stages and explaining how one stage leads to another. Repeated observations help reveal patterns over time.','In the water cycle, water evaporates, vapour condenses into droplets, and precipitation returns water to the ground where it may collect.','Why record weather observations over several days rather than only once?','Repeated observations reveal patterns and changes; a single observation may not represent usual conditions.']);
  else if(/force|energy|light|sound|electric|magnet|motion|heat/.test(k))choose(['Link cause, effect and evidence','A scientific explanation describes what changes and why. For an investigation, predict, use safe equipment, keep the test fair and record what happens.','A push can start a toy moving; friction can slow it down. To compare surfaces, keep the toy and starting method similar.','In a fair test of how surface affects a toy car’s distance, what should stay the same?','Keep the car, starting point, ramp or push, and measuring method the same; change only the surface.']);
  else if(/plant|animal|living|habitat|ecosystem|environment|food chain|health|body|disease|sustain/.test(k))choose(['Connect living things, health and environment','Living things depend on structures, resources and relationships. Explain what an organism needs and how changes in its surroundings may affect survival or health.','Plants need light, water, air and suitable conditions to grow. Comparing plants with one condition changed can help investigate the role of that condition.','Give one action a school or community can take to protect a habitat or reduce disease risk.','Examples include disposing of rubbish properly, removing stagnant water, protecting vegetation or keeping drinking water clean; explain how the action helps.']);
  else choose(['Observe, explain and use evidence','Science combines observations, questions, fair investigations and evidence-based explanations. Distinguish what you observed from what you think caused it.','If a shadow changes length during the day, record the time and length before suggesting why the change occurred.','Why should scientists record observations instead of relying only on memory?','Records can be checked, compared, shared and used to support or revise an explanation.']);
 }else{
  if(/cyber|safety|ethic|privacy|citizenship|security|responsible/.test(k))choose(['Make safe and responsible digital choices','Protect private information, use strong unique passwords, check unexpected links and ask a trusted adult or teacher when uncertain.','If a message promises a prize but asks for your password, do not reply or open its links. Verify independently and report the suspicious message.','What should you do if an unfamiliar person online asks for your home address and school?','Do not share those details. Stop the conversation and tell a trusted adult or teacher; report or block the account if appropriate.']);
  else if(/algorithm|program|coding|computational|flowchart/.test(k))choose(['Plan and test a solution','An algorithm is a clear ordered set of steps. Inputs are information provided, processing follows instructions, and outputs are results. Test different inputs.','To total 3 identical items, input the unit price, multiply by 3 and display the total. At GH₵4 each, the output is GH₵12.','What is debugging, and why test a program after changing it?','Debugging means finding and correcting errors. Testing checks that changes have not introduced new errors.']);
  else if(/data|information|spreadsheet|database/.test(k))choose(['Organise information accurately','Use meaningful headings, consistent formats and error checks. Spreadsheet formulas calculate from cell values; database fields describe attributes and records hold individual entries.','If B2 to B6 contain five scores, =SUM(B2:B6) totals them. Check that the range includes all five scores and no unrelated cells.','Why check a formula and cell range before using a spreadsheet result?','A wrong formula or range can produce an incorrect result that looks believable; checking improves accuracy.']);
  else if(/internet|network|web|communication/.test(k))choose(['Use connected technology thoughtfully','Networks connect devices to exchange data and share services. Online information should be checked for its source, date, evidence and agreement with reliable sources.','Before forwarding a health claim in a class group, check whether a trusted health service supports it. If it cannot be verified, do not present it as fact.','Name two checks to make before trusting information found online.','Check the author or organisation, date, evidence, purpose and agreement with other reliable sources.']);
  else choose(['Choose a tool, follow steps and check','Digital tools help create, process, store and communicate information. Choose a tool suited to the task, follow a sequence, save work and check the result before sharing.','For a school report, organise headings and paragraphs in a word processor, check spelling, save a named copy and confirm readability.','What should you check before sharing a file containing classmates’ personal details?','Confirm sharing is authorised, remove unnecessary private details, choose suitable access settings and follow school guidance.']);
 }
 const level=/Primary 1|Primary 2/.test(c)?'Talk it through or draw your answer.':/Primary 3|Primary 4/.test(c)?'Write a few clear sentences or show your steps.':'Give a reason and use the key vocabulary.';
 return `<section class="lesson-boost"><h2>💡 Build your understanding: ${safeText(title)}</h2><p>${safeText(idea)}</p><div class="example"><b>Worked example</b><p>${safeText(worked)}</p></div><div class="tool-panel"><b>🧠 Check your understanding</b><p>${safeText(ask)}</p><p class="muted">${safeText(level)}</p><button class="btn btn-outline" type="button" onclick="this.nextElementSibling.classList.toggle('hidden')">Reveal suggested answer</button><div class="answer hidden">${safeText(answer)}</div></div></section>`;
}

/* ===== Lesson learning roadmap: specific goals and study routines for every class/topic ===== */
function mshLessonRoadmap(c,s,t){
 const low=String(t||'').toLowerCase();let goals=[],words=[],steps=[];
 if(s==='Mathematics'){
  if(/fraction|decimal|percent/.test(low)){goals=['Represent the same quantity in more than one form.','Solve a practical problem and show the working.','Check that the answer is reasonable.'];words=['whole','equal parts','equivalent','numerator','denominator'];}
  else if(/ratio|proportion|rate/.test(low)){goals=['Identify the quantities being compared.','Use consistent units and an appropriate method.','Explain what the result means in context.'];words=['ratio','rate','proportion','scale','unit'];}
  else if(/algebra|equation|unknown|expression|formula|function|pattern|graph|relation|inequalit/.test(low)){goals=['Identify known values and the unknown.','Represent the relationship with a rule, expression, table or graph.','Test the answer or rule with a value.'];words=['variable','expression','equation','rule','substitute'];}
  else if(/geometry|shape|line|angle|transform|measurement|perimeter|area|volume/.test(low)){goals=['Describe the shape, measurement or transformation accurately.','Choose a suitable diagram, unit or formula.','Show working and include units when needed.'];words=['length','angle','perimeter','area','unit'];}
  else if(/data|statistics|probability|chance/.test(low)){goals=['Organise or interpret information accurately.','Choose an appropriate table, chart or summary.','Make a conclusion supported by data.'];words=['data','frequency','scale','average','likelihood'];}
  else if(/money|financial|profit|loss|interest|budget/.test(low)){goals=['Identify the amounts and what they represent.','Choose the correct calculation and show working.','Explain the result in a money decision.'];words=['cost price','selling price','profit','discount','budget'];}
  else{goals=['Explain the main mathematical idea in your own words.','Choose a useful representation or operation.','Show the steps and check the answer.'];words=['quantity','method','estimate','operation','check'];}
  steps=['Read the whole question; identify what is known and what must be found.','Choose a diagram, number sentence, table or formula before calculating.','Show each important step, include units where needed, then estimate or use an inverse operation to check.'];
 }else if(s==='Science'){
  if(/environment|ecosystem|plant|animal|living|habitat|human|health|disease|sustain/.test(low)){goals=['Describe the organism, body system or environmental relationship.','Connect the idea to a real situation in Ghana.','Use observations or evidence to support an explanation.'];words=['organism','habitat','function','evidence','adaptation'];}
  else if(/cycle|water|earth|space|weather|season|sun|moon/.test(low)){goals=['Name the important stages, parts or patterns.','Explain how one stage or part affects another.','Communicate the idea with a labelled diagram or observation.'];words=['stage','cycle','pattern','change','observation'];}
  else if(/force|energy|light|sound|electric|magnet|motion/.test(low)){goals=['Describe the scientific idea using accurate terms.','Predict what may happen in an example or safe investigation.','Use results to decide whether evidence supports the prediction.'];words=['force','energy','effect','variable','result'];}
  else{goals=['Define and describe the topic with scientific vocabulary.','Compare or explain relevant examples.','Use safe investigation and evidence-based reasoning where appropriate.'];words=['property','classify','observe','evidence','conclusion'];}
  steps=['Begin with a question or observation and make a prediction when appropriate.','For a fair test, change one factor at a time and record what actually happens.','Use the evidence to explain the conclusion; do not change results to match a prediction.'];
 }else{
  if(/cyber|safety|ethic|privacy|citizenship|security/.test(low)){goals=['Identify the digital risk or responsibility.','Choose a safe, respectful and lawful response.','Explain how the choice protects people or information.'];words=['privacy','permission','security','risk','responsibility'];}
  else if(/algorithm|program|coding|computational|flowchart/.test(low)){goals=['Describe the problem and expected output.','Arrange clear steps in a logical order.','Test sample inputs, identify errors and improve the solution.'];words=['algorithm','input','process','output','debug'];}
  else if(/data|information|spreadsheet|database/.test(low)){goals=['Explain how information is collected or organised.','Choose a suitable way to process or present data.','Check accuracy and privacy before sharing.'];words=['data','record','field','formula','accuracy'];}
  else{goals=['Explain the purpose of the digital concept or tool.','Identify the steps or components involved.','Apply safe practice and check the result.'];words=['hardware','software','data','system','user'];}
  steps=['State the task and expected result before choosing a tool.','Follow clear steps and test the result with a simple example.','Protect personal information, respect copyright and ask for help when unsure.'];
 }
 const age=/Primary 1|Primary 2/.test(c)?'Use objects, pictures, spoken explanations and short sentences.':/Primary 3|Primary 4/.test(c)?'Use drawings, tables, examples and complete sentences to explain your thinking.':/Primary 5|Primary 6/.test(c)?'Show working, use accurate vocabulary and compare methods.':'Use precise subject vocabulary, justify conclusions and consider alternative methods or evidence.';
 return `<div class="lesson-roadmap"><div class="lesson-roadmap-card"><h3>🎯 Learning goals</h3><ul>${goals.map(x=>`<li>${safeText(x)}</li>`).join('')}</ul><p class="muted">${safeText(age)}</p></div><div class="lesson-roadmap-card"><h3>🧭 How to work through it</h3><ol>${steps.map(x=>`<li>${safeText(x)}</li>`).join('')}</ol></div><div class="lesson-roadmap-card"><h3>🔑 Key vocabulary</h3><p>${words.map(x=>`<span class="pill" style="display:inline-block;margin:3px">${safeText(x)}</span>`).join('')}</p><p class="muted">Try to use these words when explaining the topic to a classmate or teacher.</p></div></div>`;
}

/* ===== Exam Preparation Centre: timed mixed-topic mock tests with answer review ===== */
let mshExamTimer=null,mshActiveExam=null;
function mshFormatTime(seconds){seconds=Math.max(0,Number(seconds)||0);return String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0');}
function mshShuffle(items){const a=items.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function showExamCentre(){
 if(mshExamTimer){clearInterval(mshExamTimer);mshExamTimer=null;}mshActiveExam=null;
 const cls=curriculum[state.class]?state.class:'Primary 6';const results=(state.mockTests||[]).slice(0,10);
 document.getElementById('app').innerHTML=`<div class="breadcrumb"><span class="crumb" onclick="goHome()">Dashboard</span> › <b>Exam Centre</b></div><section class="hero"><h1>📝 Exam Preparation Centre</h1><p>Practise with timed mixed-topic tests, get a score, and review every answer. These are original practice questions informed by the handbook topics, not official examination papers.</p><div class="exam-meta"><span class="pill">20 questions</span><span class="pill">Timed test</span><span class="pill">Answer explanations</span></div></section><section class="feature-panel"><h2>Set up a mock test</h2><p>Choose your class, subject and time limit. Questions are sampled across topics in your selection.</p><div class="exam-settings"><div><label for="mshExamClass">Class</label><select id="mshExamClass" onchange="mshUpdateExamSubjects()">${Object.keys(curriculum).map(c=>`<option value="${safeText(c)}" ${c===cls?'selected':''}>${safeText(c)}</option>`).join('')}</select></div><div><label for="mshExamSubject">Subject</label><select id="mshExamSubject">${['All Subjects',...Object.keys(curriculum[cls])].map(x=>`<option value="${safeText(x)}">${safeText(x)}</option>`).join('')}</select></div><div><label for="mshExamMinutes">Time limit</label><select id="mshExamMinutes"><option value="10">10 minutes</option><option value="20" selected>20 minutes</option><option value="30">30 minutes</option></select></div></div><div class="actions"><button class="btn btn-primary" onclick="mshStartExam()">Start 20-question mock test →</button><button class="btn btn-outline" onclick="goHome()">Back to Dashboard</button></div><p class="muted">Tip: work independently, show rough working on paper, and review missed answers after submitting.</p></section><div class="dashboard-heading"><div><h2>Recent mock-test results</h2><p>Results are saved in this browser and included in the downloadable backup.</p></div></div>${results.length?results.map(r=>`<div class="saved-row"><div class="saved-copy"><b>${safeText(r.class)} · ${safeText(r.subject)}</b><small>${new Date(r.date).toLocaleString()} · ${r.durationMinutes} minutes allowed</small></div><span class="pill">${r.correct}/${r.total} · ${r.percent}%</span><button class="btn btn-outline" onclick="mshReviewExam(${jsArg(r.id)})">Review</button></div>`).join(''):`<div class="empty"><p>No mock tests completed yet. Start your first test above.</p></div>`}`;
}
function mshUpdateExamSubjects(){const c=document.getElementById('mshExamClass')?.value,sel=document.getElementById('mshExamSubject');if(!c||!sel||!curriculum[c])return;const old=sel.value;sel.innerHTML=['All Subjects',...Object.keys(curriculum[c])].map(x=>`<option value="${safeText(x)}">${safeText(x)}</option>`).join('');if([...sel.options].some(o=>o.value===old))sel.value=old;}
function mshStartExam(){
 const c=document.getElementById('mshExamClass')?.value,subject=document.getElementById('mshExamSubject')?.value,minutes=Number(document.getElementById('mshExamMinutes')?.value)||20;if(!curriculum[c])return;
 const subjects=subject==='All Subjects'?Object.keys(curriculum[c]):[subject];let pool=[];
 subjects.forEach(sub=>(curriculum[c][sub]||[]).forEach(t=>{const qs=buildChoiceQuestions(c,sub,t,topicContent(c,sub,t));qs.forEach(q=>pool.push({...q,topic:t,subject:sub}));}));
 const seen=new Set();pool=mshShuffle(pool).filter(q=>{const k=q.subject+'|'+String(q.q).replace(/^\d+\.\s*/,'').trim().toLowerCase();if(seen.has(k))return false;seen.add(k);return true;});
 if(pool.length<20){alert('There are not enough unique questions for this selection. Please choose All Subjects or another class.');return;}
 mshActiveExam={id:'mock-'+Date.now(),class:c,subject,durationMinutes:minutes,remainingSeconds:minutes*60,questions:mshShuffle(pool).slice(0,20).map((q,i)=>({...q,id:i,selected:null})),submitted:false};mshRenderExam();
 mshExamTimer=setInterval(()=>{if(!mshActiveExam||mshActiveExam.submitted){clearInterval(mshExamTimer);mshExamTimer=null;return;}mshActiveExam.remainingSeconds--;const clock=document.getElementById('mshExamClock');if(clock)clock.textContent=mshFormatTime(mshActiveExam.remainingSeconds);if(mshActiveExam.remainingSeconds<=0)mshSubmitExam(true);},1000);
}
function mshRenderExam(){if(!mshActiveExam)return;const e=mshActiveExam;document.getElementById('app').innerHTML=`<div class="breadcrumb"><span class="crumb" onclick="mshConfirmLeaveExam()">Exam Centre</span> › <b>Mock Test</b></div><section class="hero"><h1>${safeText(e.class)} Mock Test</h1><p>${safeText(e.subject)} · 20 questions · One mark per question.</p><div class="exam-meta"><span class="pill">Answered: <b id="mshAnswered">0</b>/20</span><span class="pill">No penalty for incorrect answers</span></div></section><div class="exam-banner"><div><b>⏱ Time remaining</b><p style="margin:3px 0 0;color:#cbd5e1">The test submits automatically when time runs out.</p></div><div class="exam-clock" id="mshExamClock">${mshFormatTime(e.remainingSeconds)}</div></div>${e.questions.map((q,i)=>`<section class="exam-question"><h3>${i+1}. ${safeText(String(q.q).replace(/^\d+\.\s*/,''))}</h3><p class="muted">${safeText(q.subject)} · ${safeText(q.topic)}</p><div class="reflection">${q.options.map((op,j)=>`<label><input type="radio" name="msh-answer-${i}" value="${j}" onchange="mshSetAnswer(${i},${j})"/> <span><b>${String.fromCharCode(65+j)}.</b> ${safeText(op)}</span></label>`).join('')}</div></section>`).join('')}<div class="exam-banner"><div><b>Ready to finish?</b><p style="margin:3px 0 0;color:#cbd5e1">You can submit before the timer ends.</p></div><button class="btn btn-accent" onclick="mshSubmitExam(false)">Submit test</button></div>`;}
function mshSetAnswer(i,j){if(!mshActiveExam||mshActiveExam.submitted)return;mshActiveExam.questions[i].selected=Number(j);const n=mshActiveExam.questions.filter(q=>q.selected!==null).length;const el=document.getElementById('mshAnswered');if(el)el.textContent=n;}
function mshConfirmLeaveExam(){if(!mshActiveExam||mshActiveExam.submitted){showExamCentre();return;}if(confirm('Leave this test? Your current answers will not be saved as a completed test.')){clearInterval(mshExamTimer);mshExamTimer=null;mshActiveExam=null;showExamCentre();}}
function mshSubmitExam(auto){if(!mshActiveExam||mshActiveExam.submitted)return;const e=mshActiveExam;e.submitted=true;if(mshExamTimer){clearInterval(mshExamTimer);mshExamTimer=null;}const correct=e.questions.filter(q=>q.selected===q.correct).length;const result={id:e.id,date:new Date().toISOString(),class:e.class,subject:e.subject,total:e.questions.length,correct,percent:Math.round(correct/e.questions.length*100),durationMinutes:e.durationMinutes,elapsedSeconds:Math.max(0,e.durationMinutes*60-e.remainingSeconds),autoSubmitted:!!auto,questions:e.questions.map(q=>({q:String(q.q).replace(/^\d+\.\s*/,''),options:q.options,correct:q.correct,selected:q.selected,explanation:q.explanation||q.why||'',topic:q.topic,subject:q.subject}))};state.mockTests=[result,...(state.mockTests||[]).filter(x=>x.id!==result.id)].slice(0,20);save();mshRenderExamResult(result,auto);}
function mshRenderExamResult(r,auto){document.getElementById('app').innerHTML=`<div class="breadcrumb"><span class="crumb" onclick="showExamCentre()">Exam Centre</span> › <b>Results</b></div><section class="hero"><h1>${auto?'⏰ Time is up — test submitted':'🎉 Mock Test Complete'}</h1><p>${safeText(r.class)} · ${safeText(r.subject)}</p><div class="exam-score">${r.correct}/${r.total} · ${r.percent}%</div><p>${r.questions.filter(q=>q.selected!==null).length} answered out of ${r.total}. ${r.percent>=80?'Strong work. Review any missed answers and try again.':r.percent>=55?'Good effort. Read the explanations for missed answers before your next attempt.':'Keep practising. Revisit the lessons for the topics you found difficult.'}</p></section><div class="actions"><button class="btn btn-primary" onclick="mshReviewExam(${jsArg(r.id)})">Review answers and explanations</button><button class="btn btn-outline" onclick="showExamCentre()">Take another test</button><button class="btn btn-outline" onclick="window.print()">Print results</button></div><section class="feature-panel"><h2>Answer review</h2>${r.questions.map((q,i)=>`<div class="exam-review-row ${q.selected===q.correct?'exam-correct':'exam-wrong'}"><b>${i+1}. ${safeText(q.q)}</b><p><b>Your answer:</b> ${q.selected===null?'Not answered':safeText(q.options[q.selected])}</p><p><b>Correct answer:</b> ${safeText(q.options[q.correct])}</p><p>${safeText(q.explanation)}</p><small>${safeText(q.subject)} · ${safeText(q.topic)}</small></div>`).join('')}</section>`;}
function mshReviewExam(id){const r=(state.mockTests||[]).find(x=>x.id===id);if(r){mshRenderExamResult(r,false);return;}showExamCentre();}

/* Add study goals and assessment access without replacing existing lesson rendering. */
const mshOpenTopicBeforeRoadmap=openTopic;
openTopic=function(c,s,t){const result=mshOpenTopicBeforeRoadmap(c,s,t);const article=document.querySelector('.lesson');const chips=article?.querySelector('.chips');if(article&&chips&&!article.querySelector('.lesson-roadmap'))chips.insertAdjacentHTML('afterend',mshLessonRoadmap(c,s,t));const roadmap=article?.querySelector('.lesson-roadmap');if(article&&!article.querySelector('.lesson-boost')){if(roadmap)roadmap.insertAdjacentHTML('afterend',mshLessonBoost(c,s,t));else if(chips)chips.insertAdjacentHTML('afterend',mshLessonBoost(c,s,t));}return result;};
const mshRenderHomeBeforeExam=renderHome;
renderHome=function(){mshRenderHomeBeforeExam();const grid=document.querySelector('.quick-grid');if(grid&&!document.getElementById('mshExamQuickCard'))grid.insertAdjacentHTML('beforeend',`<div class="quick-card" id="mshExamQuickCard" onclick="showExamCentre()"><div class="emoji">📝</div><h3>Exam Preparation</h3><p>Take timed mock tests, check scores and review answer explanations.</p></div>`);};
const mshShowProfileBeforeExam=showProfile;
showProfile=function(){mshShowProfileBeforeExam();addBackupControls();};

renderHome();
</script>
</body></html>
