
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#0f766e">
<title>My Study Handbook</title>
<style>
:root{--primary:#0f766e;--primary2:#115e59;--accent:#f59e0b;--bg:#f4f7f8;--card:#fff;--text:#17202a;--muted:#64748b;--border:#e2e8f0;--danger:#dc2626;--shadow:0 8px 25px rgba(15,23,42,.07)}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.6}.hidden{display:none!important}
header{background:linear-gradient(135deg,var(--primary2),var(--primary));color:#fff;position:sticky;top:0;z-index:20;box-shadow:0 3px 12px #0002}.bar{max-width:1180px;margin:auto;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-weight:800;font-size:1.15rem;cursor:pointer}.brand small{display:block;font-size:.7rem;opacity:.8;font-weight:500}.header-actions{display:flex;gap:8px}.btn{border:0;border-radius:10px;padding:10px 15px;font-weight:700;cursor:pointer}.btn-light{background:#ffffff1c;color:#fff}.btn-primary{background:var(--primary);color:#fff}.btn-accent{background:var(--accent);color:#111827}.btn-outline{background:#fff;border:1px solid var(--border);color:var(--text)}
main{max-width:1180px;margin:auto;padding:28px 18px 70px}.hero{background:linear-gradient(135deg,#ecfeff,#fff);border:1px solid #ccfbf1;border-radius:22px;padding:30px;box-shadow:var(--shadow);margin-bottom:24px}.hero h1{margin:0 0 8px;font-size:clamp(2rem,5vw,3.4rem);color:var(--primary2)}.hero p{max-width:760px;color:#475569;font-size:1.05rem}.search{display:flex;gap:10px;max-width:700px}.search input{flex:1;padding:13px 15px;border:1px solid var(--border);border-radius:11px;font-size:1rem;background:#fff}
.section-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:26px 0 12px}.section-title h2{margin:0}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:15px}.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);cursor:pointer;transition:.18s}.card:hover{transform:translateY(-2px);border-color:#99f6e4}.card h3{margin:5px 0}.emoji{font-size:2rem}.pill{display:inline-block;background:#ecfeff;color:var(--primary2);padding:4px 9px;border-radius:999px;font-size:.78rem;font-weight:700;margin:3px 3px 0 0}.stat{font-size:1.7rem;font-weight:800;color:var(--primary2)}
.breadcrumb{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:18px;color:var(--muted);font-size:.9rem}.crumb{cursor:pointer}.crumb:hover{color:var(--primary)}.topic-card{display:flex;gap:14px;align-items:flex-start}.topic-num{width:36px;height:36px;display:grid;place-items:center;border-radius:10px;background:#ccfbf1;color:var(--primary2);font-weight:800;flex:none}.progressbar{height:8px;background:#e2e8f0;border-radius:999px;overflow:hidden;margin-top:10px}.progressbar span{display:block;height:100%;background:var(--primary);width:0}
.lesson{background:#fff;border:1px solid var(--border);border-radius:18px;padding:25px;box-shadow:var(--shadow)}.lesson h1{margin-top:0;color:var(--primary2)}.lesson h2{margin-top:28px;color:#0f766e}.lesson h3{color:#334155}.note{background:#f0fdfa;border-left:5px solid var(--primary);padding:14px 16px;border-radius:8px;margin:14px 0}.example{background:#fffbeb;border-left:5px solid var(--accent);padding:14px 16px;border-radius:8px;margin:14px 0}.mistake{background:#fff1f2;border-left:5px solid var(--danger);padding:14px 16px;border-radius:8px}.diagram{border:1px dashed #94a3b8;border-radius:12px;padding:18px;text-align:center;background:#f8fafc;font-size:1.2rem;margin:15px 0}.chips{margin:8px 0 15px}.question{border:1px solid var(--border);border-radius:12px;padding:15px;margin:10px 0;background:#fff}.question strong{display:block;margin-bottom:7px}.answer{background:#f8fafc;border-radius:8px;padding:10px;margin-top:8px;color:#334155}.actions{display:flex;flex-wrap:wrap;gap:9px;margin:18px 0}.footer{margin-top:45px;padding:22px;text-align:center;color:var(--muted);font-size:.88rem;border-top:1px solid var(--border)}
.profile{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.input{width:100%;padding:12px;border:1px solid var(--border);border-radius:10px;font-size:1rem}.toast{position:fixed;bottom:20px;right:20px;background:#0f172a;color:#fff;padding:12px 16px;border-radius:10px;display:none;z-index:99}.empty{padding:30px;text-align:center;background:#fff;border:1px dashed var(--border);border-radius:14px;color:var(--muted)}
@media(max-width:650px){main{padding:18px 12px 60px}.hero{padding:22px}.bar{padding:12px}.header-actions .btn{padding:8px 10px}.lesson{padding:18px}.search{flex-direction:column}.grid{grid-template-columns:1fr 1fr}.grid .card{padding:15px}}
@media(max-width:420px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div class="bar"><div class="brand" onclick="goHome()">📚 My Study Handbook<small>Learn • Practice • Improve</small></div><div class="header-actions"><button class="btn btn-light" onclick="showProfile()">Profile</button><button class="btn btn-accent" onclick="goHome()">Home</button></div></div></header>
<main id="app"></main><div class="toast" id="toast"></div>
<script>
const curriculum={
"Primary 1":{
 Mathematics:["Numbers: Counting, Representation and Cardinality","Numbers: Operations","Fractions: Representation and Relationship","Patterns and Relationships","Lines and Shapes","Position and Transformation","Measurements","Data: Collection and Organisation"],
 Science:["Materials and Their Properties","Living Things","Human Body and Healthy Living","Plants and Animals","Our Environment","Weather and Seasons","Forces and Energy","Light and Sound"]},
"Primary 2":{
 Mathematics:["Numbers: Counting, Representation and Cardinality","Numbers: Operations","Fractions: Representation and Relationship","Patterns and Relationships","Lines and Shapes","Position and Transformation","Measurements","Data: Collection and Organisation"],
 Science:["Materials and Their Uses","Living Things and Their Needs","Human Body and Personal Hygiene","Plants and Their Uses","Animals and Their Habitats","Environment and Sanitation","Forces and Energy","Weather and Water"]},
"Primary 3":{
 Mathematics:["Numbers: Counting, Representation and Cardinality","Numbers: Operations","Fractions: Representation and Relationship","Patterns and Relationships","Lines and Shapes","Position and Transformation","Measurements","Data: Collection and Organisation"],
 Science:["Matter and Materials","Living Things and Life Processes","Human Body and Health","Plants and Animals","The Environment","Water and Air","Forces and Energy","Simple Technology"]},
"Primary 4":{
 Mathematics:["Whole Numbers: Counting and Representation","Whole Numbers Operations","Fractions Representation and Relationship","Patterns and Relationships","Functions and Unknowns","Expressions","Equations and Inequalities","Lines and Shapes","Measurements","Geometrical Reasoning","Data: Collection, Organisation and Interpretation","Chance (Probability)"],
 Science:["Diversity of Matter","Cycles","Systems","Forces and Energy","The Human Body","Plants and Animals","Earth and Space","Science and Technology"],
 Computing:["Introduction to Computing","Computer Systems","Files and Folders","Word Processing","Graphics and Presentations","Internet and Communication","Digital Citizenship","Algorithms and Problem Solving"]},
"Primary 5":{
 Mathematics:["Whole Numbers: Counting and Representation","Whole Numbers Operations","Fractions Representation and Relationship","Patterns and Relationships","Functions and Unknowns","Expressions","Equations and Inequalities","Lines and Shapes","Measurements","Geometrical Reasoning","Data: Collection, Organisation and Interpretation","Chance (Probability)"],
 Science:["Diversity of Matter","Cycles","Systems","Forces and Energy","The Human Body","Plants and Animals","Earth and Space","Science and Technology"],
 Computing:["Computer Hardware and Software","Data and Information","Word Processing and Document Design","Spreadsheets","Presentation Software","Networks and Internet","Digital Safety and Ethics","Algorithms and Programming"]},
"Primary 6":{
 Mathematics:["Whole Numbers: Counting and Representation","Whole Numbers Operations","Fractions Representation and Relationship","Patterns and Relationships","Functions and Unknowns","Expressions","Equations and Inequalities","Lines and Shapes","Measurements","Geometrical Reasoning","Data: Collection, Organisation and Interpretation","Chance (Probability)"],
 Science:["Diversity of Matter","Cycles","Systems","Forces and Energy","The Human Body","Plants and Animals","Earth and Space","Science and Technology"],
 Computing:["Computer Systems and Networks","Data and Information","Spreadsheets and Data Processing","Digital Communication","Internet Services","Programming and Algorithms","Cyber Safety and Responsible Use","Digital Projects"]},
"JHS 1":{
 Mathematics:["Number and Numeration Systems","Operations on Numbers","Fractions, Decimals and Percentages","Ratio and Proportion","Algebraic Expressions","Linear Equations","Geometry and Measurement","Transformations","Statistics and Data","Probability","Problem Solving","Financial Mathematics"],
 Science:["Diversity of Matter","Cycles","Systems","Forces and Energy","Humans and Their Environment","Earth and Space","Science and Technology","Health and Disease"],
 Computing:["Computing and Society","Computer Hardware and Software","Data Representation","Word Processing","Spreadsheets","Computer Networks","Internet and Web Technologies","Algorithms and Programming","Cyber Safety and Ethics"]},
"JHS 2":{
 Mathematics:["Number and Numeration Systems","Operations on Numbers","Fractions, Decimals and Percentages","Ratio and Proportion","Algebraic Expressions","Linear Equations","Geometry and Measurement","Transformations","Statistics and Data","Probability","Problem Solving","Financial Mathematics"],
 Science:["Diversity of Matter","Cycles","Systems","Forces and Energy","Humans and Their Environment","Earth and Space","Science and Technology","Health and Disease"],
 Computing:["Information and Communication Technologies","Data and Information","Computer Networks","Web Technologies","Spreadsheets and Data Analysis","Algorithms and Flowcharts","Programming Concepts","Cybersecurity and Digital Citizenship","Digital Project Development"]},
"JHS 3":{
 Mathematics:["Real Numbers","Operations on Numbers","Fractions, Decimals and Percentages","Ratio, Proportion and Rates","Algebraic Expressions and Formulae","Equations and Inequalities","Geometry and Measurement","Geometrical Reasoning","Statistics and Probability","Graphs and Relations","Financial Mathematics","Advanced Problem Solving"],
 Science:["Diversity of Matter","Cycles","Systems","Forces and Energy","Human Body and Health","Environment and Sustainability","Earth and Space","Science, Technology and Society"],
 Computing:["Computational Thinking","Data and Information Management","Networks and Internet","Web and Digital Technologies","Programming and Algorithms","Databases and Data Analysis","Cybersecurity","Digital Ethics and Responsible Use","Digital Project and Problem Solving"]}
};
const subjectMeta={Mathematics:{icon:"➗",desc:"Build number sense, reasoning and problem-solving skills."},Science:{icon:"🔬",desc:"Explore living things, matter, energy, Earth and technology."},Computing:{icon:"💻",desc:"Develop digital literacy, computational thinking and safe technology use."}};
const state=JSON.parse(localStorage.getItem('myStudyHandbook')||'{"class":"","progress":{},"profile":{"name":"","school":""}}');
function save(){localStorage.setItem('myStudyHandbook',JSON.stringify(state))}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2200)}
function goHome(){renderHome()}
function renderHome(){
 let completed=Object.values(state.progress).filter(Boolean).length;
 document.getElementById('app').innerHTML=`<section class="hero"><h1>My Study Handbook</h1><p>A digital study companion for Ghanaian learners. Select your class, choose a subject and study curriculum-based topics with notes, examples, activities, revision and practice.</p><div class="search"><input id="search" placeholder="Search a class or topic..." oninput="searchAll(this.value)"><button class="btn btn-primary" onclick="showProfile()">Set Profile</button></div></section>
 <div id="searchResults"></div><div class="section-title"><h2>Choose your class</h2><span class="muted">${completed} topics completed</span></div><div class="grid">${Object.keys(curriculum).map(c=>`<div class="card" onclick="selectClass('${c}')"><div class="emoji">${c.startsWith('Primary')?'🎒':'🎓'}</div><h3>${c}</h3><p class="muted">${Object.keys(curriculum[c]).join(' • ')}</p><span class="pill">${Object.values(curriculum[c]).reduce((a,b)=>a+b.length,0)} study topics</span></div>`).join('')}</div>
 <div class="section-title"><h2>How to use the portal</h2></div><div class="grid"><div class="card"><div class="emoji">📖</div><h3>Study</h3><p>Read the notes and worked examples for each topic.</p></div><div class="card"><div class="emoji">🧪</div><h3>Apply</h3><p>Connect what you learn to practical situations and activities.</p></div><div class="card"><div class="emoji">📝</div><h3>Practise</h3><p>Test yourself with application and reasoning questions.</p></div><div class="card"><div class="emoji">📊</div><h3>Track</h3><p>Completed topics are saved on your device.</p></div></div><div class="footer">My Study Handbook • NaCCA-aligned framework • Original learning content<br>Not an official NaCCA publication.</div>`;
}
function searchAll(q){q=q.trim().toLowerCase();const box=document.getElementById('searchResults');if(!q){box.innerHTML='';return}let hits=[];for(const c in curriculum)for(const s in curriculum[c])curriculum[c][s].forEach(t=>{if((c+' '+s+' '+t).toLowerCase().includes(q))hits.push({c,s,t})});box.innerHTML=hits.length?`<div class="section-title"><h2>Search results</h2></div><div class="grid">${hits.slice(0,20).map(x=>`<div class="card" onclick="openTopic('${x.c}','${x.s}','${x.t.replace(/'/g,"\\'")}')"><b>${x.c}</b><p>${subjectMeta[x.s]?.icon||'📘'} ${x.s}</p><h3>${x.t}</h3></div>`).join('')}</div>`:`<div class="empty">No matching topic found.</div>`}
function selectClass(c){state.class=c;save();renderSubjects(c)}
function renderSubjects(c){document.getElementById('app').innerHTML=`<div class="breadcrumb"><span class="crumb" onclick="goHome()">Home</span> › <b>${c}</b></div><div class="hero"><h1>${c}</h1><p>Choose a subject to continue your study.</p></div><div class="grid">${Object.keys(curriculum[c]).map(s=>`<div class="card" onclick="renderTopics('${c}','${s}')"><div class="emoji">${subjectMeta[s].icon}</div><h3>${s}</h3><p class="muted">${subjectMeta[s].desc}</p><span class="pill">${curriculum[c][s].length} topics</span></div>`).join('')}</div>`}
function renderTopics(c,s){const topics=curriculum[c][s];const done=topics.filter(t=>state.progress[`${c}|${s}|${t}`]).length;document.getElementById('app').innerHTML=`<div class="breadcrumb"><span class="crumb" onclick="goHome()">Home</span> › <span class="crumb" onclick="renderSubjects('${c}')">${c}</span> › <b>${s}</b></div><div class="hero"><h1>${subjectMeta[s].icon} ${s}</h1><p>${subjectMeta[s].desc}</p><div class="progressbar"><span style="width:${done/topics.length*100}%"></span></div><small>${done} of ${topics.length} topics completed</small></div><div class="grid">${topics.map((t,i)=>{let key=`${c}|${s}|${t}`;return `<div class="card topic-card" onclick="openTopic('${c}','${s}','${t.replace(/'/g,"\\'")}')"><div class="topic-num">${i+1}</div><div style="flex:1"><h3>${t}</h3><p class="muted">Study notes • examples • application • practice</p><span class="pill">${state.progress[key]?'✓ Completed':'Start topic'}</span></div></div>`}).join('')}</div>`}
function topicContent(c,s,t){
 const math=s==='Mathematics'; const sci=s==='Science'; const comp=s==='Computing';
 let concept,examples,activity,real,mistakes,revision;
 if(math){concept=`This topic develops the learner's ability to understand mathematical ideas, represent information clearly, choose appropriate operations or relationships, and explain how an answer was obtained. Start by identifying what is known, what is required, and which mathematical idea connects the two.`;examples=[`Read the question carefully and identify the quantities involved.`,`Represent the information using numbers, a table, diagram, number line or simple equation where useful.`,`Carry out the operation or reasoning step by step and check whether the result makes sense.`];real=`Mathematics is used when budgeting money, comparing prices, measuring ingredients, planning journeys, reading charts, sharing items fairly and interpreting information at school or at home.`;activity=`Create a small real-life problem from your home or school. Record the information, show your working, solve it and explain why your answer is reasonable.`;mistakes=[`Rushing into a calculation before identifying what the question asks.`,`Ignoring units such as cm, kg, litres or Ghana cedis.`,`Giving an answer without checking whether it is sensible.`];revision=`Ask yourself: What is the key idea? What information is given? Which method is appropriate? Can I explain my answer in words?`}
 else if(sci){concept=`Science asks learners to observe, describe, classify, explain relationships, carry out fair investigations and use evidence to make conclusions. When studying this topic, connect the idea to things that can be observed in the home, school, community or natural environment.`;examples=[`Make an observation before giving an explanation.`,`Identify variables or conditions that may affect what happens.`,`Record results clearly and use evidence when drawing a conclusion.`];real=`Science helps us understand health, food, water, sanitation, agriculture, energy, weather, materials, the human body and technologies used in everyday life.`;activity=`Choose a safe observation related to this topic. Write what you predict, observe or measure, then compare your result with your prediction and explain the difference.`;mistakes=[`Confusing an observation with an explanation.`,`Changing several conditions at once during an investigation.`,`Making a conclusion that is not supported by the evidence.`];revision=`Remember: observe → question → predict → investigate → record → conclude → communicate.`}
 else {concept=`Computing combines digital literacy, problem solving and responsible technology use. A good learner should understand not only how to operate a device, but also why a digital tool is appropriate, how information is processed and how to stay safe and ethical online.`;examples=[`Break a task into smaller steps before trying to solve it.`,`Choose the right digital tool for the job.`,`Protect personal information and check the reliability of digital information.`];real=`Computing is used for school research, communication, record keeping, banking, business, creative work, data analysis and services such as online learning.`;activity=`Take one everyday task and write the steps needed to complete it. Identify which steps could be supported by a computer and what information would be needed.`;mistakes=[`Sharing passwords or sensitive information carelessly.`,`Following instructions without checking the source or purpose.`,`Using technology without considering privacy, accuracy or respectful behaviour.`];revision=`Remember: understand the problem → plan → use the right tool → test/check → improve → use technology responsibly.`}
 return {concept,examples,activity,real,mistakes,revision};
}
function makeQuestions(c,s,t){let arr=[];for(let i=1;i<=50;i++){let level=i<=15?'Understand':i<=30?'Apply':i<=42?'Reason': 'Challenge';let q;if(s==='Mathematics')q=`${i}. ${level}: Imagine a real-life situation involving “${t}”. State what information you would need, choose a suitable mathematical method, and explain how you would check your answer.`;else if(s==='Science')q=`${i}. ${level}: A situation related to “${t}” occurs at home, school or in the community. What would you observe, what would you predict, and what evidence would you use to support your conclusion?`;else q=`${i}. ${level}: You are asked to solve a school or community problem using “${t}”. Describe the steps you would take, the digital tool or concept you would use, and one safety or ethical issue to consider.`;arr.push({q,a:`A strong answer should identify the relevant concept, use evidence or appropriate steps, explain the reasoning clearly, and check the result.`});}return arr}
function openTopic(c,s,t){const data=topicContent(c,s,t);const key=`${c}|${s}|${t}`;const questions=makeQuestions(c,s,t);document.getElementById('app').innerHTML=`<div class="breadcrumb"><span class="crumb" onclick="goHome()">Home</span> › <span class="crumb" onclick="renderSubjects('${c}')">${c}</span> › <span class="crumb" onclick="renderTopics('${c}','${s}')">${s}</span> › <b>${t}</b></div><article class="lesson"><h1>${t}</h1><div class="chips"><span class="pill">${c}</span><span class="pill">${s}</span><span class="pill">NaCCA-aligned framework</span></div><section><h2>📖 Study Notes</h2><p>${data.concept}</p><div class="note"><b>Study approach:</b> Do not memorise isolated facts only. Connect the idea to examples, explain it in your own words and practise using it in unfamiliar situations.</div></section><section><h2>✏️ Worked Approach & Examples</h2>${data.examples.map((x,i)=>`<div class="example"><b>Example ${i+1}</b><br>${x}</div>`).join('')}<div class="diagram">${s==='Mathematics'?'Known information → Method/Representation → Working → Answer → Check':s==='Science'?'Observation → Question → Prediction → Investigation → Evidence → Conclusion':'Problem → Plan → Tool/Algorithm → Test → Improve → Responsible use'}</div></section><section><h2>🌍 Real-Life Application</h2><p>${data.real}</p></section><section><h2>🧪 Practical Activity</h2><p>${data.activity}</p></section><section><h2>⚠️ Common Mistakes</h2><div class="mistake"><ul>${data.mistakes.map(x=>`<li>${x}</li>`).join('')}</ul></div></section><section><h2>🧠 Quick Revision</h2><p>${data.revision}</p></section><section><h2>📝 50 Application Questions</h2><p class="muted">Questions are arranged from understanding to application, reasoning and challenge. Use your exercise book for working.</p>${questions.map(x=>`<div class="question"><strong>${x.q}</strong><button class="btn btn-outline" onclick="this.nextElementSibling.classList.toggle('hidden')">Show marking guide</button><div class="answer hidden">${x.a}</div></div>`).join('')}</section><div class="actions"><button class="btn btn-primary" onclick="completeTopic('${key.replace(/'/g,"\\'")}')">${state.progress[key]?'✓ Completed':'Mark Topic Complete'}</button><button class="btn btn-outline" onclick="renderTopics('${c}','${s}')">Back to Topics</button></div></article><div class="footer">Use this handbook alongside your teacher's lessons, approved learning materials and school assessments.</div>`}
function completeTopic(key){state.progress[key]=true;save();toast('Topic marked complete ✓');}
function showProfile(){document.getElementById('app').innerHTML=`<div class="breadcrumb"><span class="crumb" onclick="goHome()">Home</span> › <b>Profile</b></div><div class="hero"><h1>Student Profile</h1><p>Your profile is stored only on this device.</p></div><div class="card"><div class="profile"><div><label>Student name</label><input class="input" id="pname" value="${state.profile.name||''}" placeholder="Enter your name"></div><div><label>School</label><input class="input" id="pschool" value="${state.profile.school||''}" placeholder="School name"></div></div><div class="actions"><button class="btn btn-primary" onclick="saveProfile()">Save Profile</button><button class="btn btn-outline" onclick="goHome()">Cancel</button></div><hr><p><b>Current class:</b> ${state.class||'Not selected'}</p><p><b>Completed topics:</b> ${Object.values(state.progress).filter(Boolean).length}</p></div>`}
function saveProfile(){state.profile.name=document.getElementById('pname').value.trim();state.profile.school=document.getElementById('pschool').value.trim();save();toast('Profile saved');goHome()}
renderHome();
</script>
</body></html>
