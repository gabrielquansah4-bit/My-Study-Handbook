<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#0f766e">
<title>My Study Handbook</title>
<style>
:root{--primary:#0f766e;--primary2:#115e59;--accent:#f59e0b;--bg:#f4f7f8;--card:#fff;--text:#17202a;--muted:#64748b;--border:#e2e8f0;--danger:#dc2626;--shadow:0 8px 25px rgba(15,23,42,.07)}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.6}.hidden{display:none!important}
header{background:linear-gradient(135deg,var(--primary2),var(--primary));color:#fff;position:sticky;top:0;z-index:20;box-shadow:0 3px 12px #0002}.bar{max-width:1180px;margin:auto;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-weight:800;font-size:1.15rem;cursor:pointer}.brand small{display:block;font-size:.7rem;opacity:.8;font-weight:500}.header-actions{display:flex;gap:8px}.btn{border:0;border-radius:10px;padding:10px 15px;font-weight:700;cursor:pointer}.btn-light{background:#ffffff1c;color:#fff}.btn-primary{background:var(--primary);color:#fff}.btn-accent{background:var(--accent);color:#111827}.btn-outline{background:#fff;border:1px solid var(--border);color:var(--text)}
main{max-width:1180px;margin:auto;padding:28px 18px 70px}.hero{background:linear-gradient(135deg,#ecfeff,#fff);border:1px solid #ccfbf1;border-radius:22px;padding:30px;box-shadow:var(--shadow);margin-bottom:24px}.hero h1{margin:0 0 8px;font-size:clamp(2rem,5vw,3.4rem);color:var(--primary2)}.hero p{max-width:760px;color:#475569;font-size:1.05rem}.search{display:flex;gap:10px;max-width:700px}.search input{flex:1;padding:13px 15px;border:1px solid var(--border);border-radius:11px;font-size:1rem;background:#fff}
.section-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:26px 0 12px}.section-title h2{margin:0}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:15px}.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);cursor:pointer;transition:.18s}.card:hover{transform:translateY(-2px);border-color:#99f6e4}.card h3{margin:5px 0}.emoji{font-size:2rem}.pill{display:inline-block;background:#ecfeff;color:var(--primary2);padding:4px 9px;border-radius:999px;font-size:.78rem;font-weight:700;margin:3px 3px 0 0}.stat{font-size:1.7rem;font-weight:800;color:var(--primary2)}
.breadcrumb{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:18px;color:var(--muted);font-size:.9rem}.crumb{cursor:pointer}.crumb:hover{color:var(--primary)}.topic-card{display:flex;gap:14px;align-items:flex-start}.topic-num{width:36px;height:36px;display:grid;place-items:center;border-radius:10px;background:#ccfbf1;color:var(--primary2);font-weight:800;flex:none}.progressbar{height:8px;background:#e2e8f0;border-radius:999px;overflow:hidden;margin-top:10px}.progressbar span{display:block;height:100%;background:var(--primary);width:0}
.lesson{background:#fff;border:1px solid var(--border);border-radius:18px;padding:25px;box-shadow:var(--shadow)}.lesson h1{margin-top:0;color:var(--primary2)}.lesson h2{margin-top:28px;color:#0f766e}.lesson h3{color:#334155}.lesson p{white-space:pre-line}.example{white-space:pre-line}.note{background:#f0fdfa;border-left:5px solid var(--primary);padding:14px 16px;border-radius:8px;margin:14px 0}.example{background:#fffbeb;border-left:5px solid var(--accent);padding:14px 16px;border-radius:8px;margin:14px 0}.mistake{background:#fff1f2;border-left:5px solid var(--danger);padding:14px 16px;border-radius:8px}.diagram{border:1px dashed #94a3b8;border-radius:12px;padding:18px;text-align:center;background:#f8fafc;font-size:1.2rem;margin:15px 0}.chips{margin:8px 0 15px}.question{border:1px solid var(--border);border-radius:12px;padding:15px;margin:10px 0;background:#fff}.question strong{display:block;margin-bottom:7px}.answer{background:#f8fafc;border-radius:8px;padding:10px;margin-top:8px;color:#334155}.actions{display:flex;flex-wrap:wrap;gap:9px;margin:18px 0}.footer{margin-top:45px;padding:22px;text-align:center;color:var(--muted);font-size:.88rem;border-top:1px solid var(--border)}
.profile{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.input{width:100%;padding:12px;border:1px solid var(--border);border-radius:10px;font-size:1rem}.toast{position:fixed;bottom:20px;right:20px;background:#0f172a;color:#fff;padding:12px 16px;border-radius:10px;display:none;z-index:99}.empty{padding:30px;text-align:center;background:#fff;border:1px dashed var(--border);border-radius:14px;color:var(--muted)}
@media(max-width:650px){main{padding:18px 12px 60px}.hero{padding:22px}.bar{padding:12px}.header-actions .btn{padding:8px 10px}.lesson{padding:18px}.search{flex-direction:column}.grid{grid-template-columns:1fr 1fr}.grid .card{padding:15px}}
@media(max-width:420px){.grid{grid-template-columns:1fr}}

/* Comprehensive learning and assessment upgrade */
.study-tools{display:flex;flex-wrap:wrap;gap:9px;margin:16px 0}.tool-panel{border:1px solid var(--border);border-radius:14px;padding:16px;background:#f8fafc;margin:14px 0}.visual-card{border:1px solid #cbd5e1;border-radius:14px;background:linear-gradient(180deg,#fff,#f8fafc);padding:16px;margin:14px 0;overflow:auto}.visual-title{font-weight:800;color:var(--primary2);margin-bottom:8px}.visual-flow{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px}.visual-node{border:1px solid #99f6e4;background:#f0fdfa;border-radius:10px;padding:10px 13px;font-weight:650;text-align:center;min-width:90px}.visual-arrow{font-size:1.25rem;color:var(--primary);font-weight:800}.visual-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(115px,1fr));gap:9px}.visual-cell{background:#fff;border:1px solid var(--border);border-radius:10px;padding:12px;text-align:center}.visual-cell b{display:block;color:var(--primary2);font-size:1.05rem}.reflection{display:grid;grid-template-columns:1fr;gap:9px}.reflection label{display:flex;gap:9px;align-items:flex-start;background:#fff;border:1px solid var(--border);border-radius:9px;padding:10px}.reflection input{margin-top:5px}.score-strip{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.level-tag{font-size:.78rem;font-weight:700;color:#0f766e;background:#ccfbf1;border-radius:99px;padding:4px 9px}.print-only{display:none}
@media print{header,.breadcrumb,.study-tools,.actions,.btn,.search,.footer{display:none!important}body{background:#fff}.lesson{box-shadow:none;border:0;padding:0}.question .answer{display:block!important}.print-only{display:block}.question{break-inside:avoid}.visual-card{break-inside:avoid}}

</style>
</head>
<body>
<header><div class="bar"><div class="brand" onclick="goHome()">📚 My Study Handbook<small>Learn • Practice • Improve</small></div><div class="header-actions"><button class="btn btn-light" onclick="showProfile()">Profile</button><button class="btn btn-accent" onclick="goHome()">Home</button></div></div></header>
<main id="app"></main><div class="toast" id="toast"></div>
<script>

 Science:["Materials and Their Properties","Living Things","Human Body and Healthy Living","Plants and Animals","Our Environment","Weather and Seasons","Forces and Energy","Light and Sound"]},
"Primary 2":{

"Primary 5":{
 Mathematics:["Whole Numbers: Counting and Representation","Whole Numbers Operations","Fractions Representation and Relationship","Patterns and Relationships","Functions and Unknowns","Expressions","Equations and Inequalities","Lines and Shapes","Measurements","Geometrical Reasoning","Data: Collection, Organisation and Interpretation","Chance (Probability)"],
 Science:["Diversity of Matter","Cycles","Systems","Forces and Energy","The Human Body","Plants and Animals","Earth and Space","Science and Technology"],
 Computing:["Computer Hardware and Software","Data and Information","Word Processing and Document Design","Spreadsheets","Presentation Software","Networks and Internet","Digital Safety and Ethics","Algorithms and Programming"]},
"Primary 6":{
 Mathematics:["Whole Numbers: Counting and Representation","Whole Numbers Operations","Fractions Representation and Relationship","Patterns and Relationships","Functions and Unknowns","Expressions","Equations and Inequalities","Lines and Shapes","Measurements","Geometrical Reasoning","Data: Collection, Organisation and Interpretation","Chance (Probability)"],
 Science:["Diversity of Matter","Cycles","Systems","Forces and Energy","The Human Body","Plants and Animals","Earth and Space","Science and Technology"],
 Computing:["Computer Systems and Networks","Data and Information","Spreadsheets and Data Processing","Digital Communication","Internet Services","Programming and Algorithms","Cyber Safety and Responsible Use","Digital Projects"]},
"JHS 1":{
 Mathematics:["Number and Numeration Systems","Operations on Numbers","Fractions, Decimals and Percentages","Ratio and Proportion","Algebraic Expressions","Linear Equations","Geometry and Measurement","Transformations","Statistics and Data","Probability","Problem Solving","Financial Mathematics"],
 Science:["Diversity of Matter","Cycles","Systems","Forces and Energy","Humans and Their Environment","Earth and Space","Science and Technology","Health and Disease"],
 Computing:["Computing and Society","Computer Hardware and Software","Data Representation","Word Processing","Spreadsheets","Computer Networks","Internet and Web Technologies","Algorithms and Programming","Cyber Safety and Ethics"]},
"JHS 2":{
 Mathematics:["Number and Numeration Systems","Operations on Numbers","Fractions, Decimals and Percentages","Ratio and Proportion","Algebraic Expressions","Linear Equations","Geometry and Measurement","Transformations","Statistics and Data","Probability","Problem Solving","Financial Mathematics"],
 Science:["Diversity of Matter","Cycles","Systems","Forces and Energy","Humans and Their Environment","Earth and Space","Science and Technology","Health and Disease"],
 Computing:["Information and Communication Technologies","Data and Information","Computer Networks","Web Technologies","Spreadsheets and Data Analysis","Algorithms and Flowcharts","Programming Concepts","Cybersecurity and Digital Citizenship","Digital Project Development"]},
"JHS 3":{
 Mathematics:["Real Numbers","Operations on Numbers","Fractions, Decimals and Percentages","Ratio, Proportion and Rates","Algebraic Expressions and Formulae","Equations and Inequalities","Geometry and Measurement","Geometrical Reasoning","Statistics and Probability","Graphs and Relations","Financial Mathematics","Advanced Problem Solving"],
 Science:["Diversity of Matter","Cycles","Systems","Forces and Energy","Human Body and Health","Environment and Sustainability","Earth and Space","Science, Technology and Society"],
 Computing:["Computational Thinking","Data and Information Management","Networks and Internet","Web and Digital Technologies","Programming and Algorithms","Databases and Data Analysis","Cybersecurity","Digital Ethics and Responsible Use","Digital Project and Problem Solving"]}
};
const subjectMeta={Mathematics:{icon:"➗",desc:"Build number sense, reasoning and problem-solving skills."},Science:{icon:"🔬",desc:"Explore living things, matter, energy, Earth and technology."},Computing:{icon:"💻",desc:"Develop digital literacy, computational thinking and safe technology use."}};
const state=JSON.parse(localStorage.getItem('myStudyHandbook')||'{"class":"","progress":{},"profile":{"name":"","school":""}}');
function save(){localStorage.setItem('myStudyHandbook',JSON.stringify(state))}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2200)}
function goHome(){renderHome()}
function renderHome(){
 let completed=Object.values(state.progress).filter(Boolean).length;
 document.getElementById('app').innerHTML=`<section class="hero"><h1>My Study Handbook</h1><p>A digital study companion for Ghanaian learners. Built around the NaCCA curriculum framework and organised into learner-friendly study units. Select your class, choose a subject and study curriculum-based topics with notes, examples, activities, revision and practice.</p><div class="search"><input id="search" placeholder="Search a class or topic..." oninput="searchAll(this.value)"><button class="btn btn-primary" onclick="showProfile()">Set Profile</button></div></section>
 <div id="searchResults"></div><div class="section-title"><h2>Choose your class</h2><span class="muted">${completed} topics completed</span></div><div class="grid">${Object.keys(curriculum).map(c=>`<div class="card" onclick="selectClass('${c}')"><div class="emoji">${c.startsWith('Primary')?'🎒':'🎓'}</div><h3>${c}</h3><p class="muted">${Object.keys(curriculum[c]).join(' • ')}</p><span class="pill">${Object.values(curriculum[c]).reduce((a,b)=>a+b.length,0)} study topics</span></div>`).join('')}</div>
 <div class="section-title"><h2>How to use the portal</h2></div><div class="grid"><div class="card"><div class="emoji">📖</div><h3>Study</h3><p>Read the notes and worked examples for each topic.</p></div><div class="card"><div class="emoji">🧪</div><h3>Apply</h3><p>Connect what you learn to practical situations and activities.</p></div><div class="card"><div class="emoji">📝</div><h3>Practise</h3><p>Test yourself with application and reasoning questions.</p></div><div class="card"><div class="emoji">📊</div><h3>Track</h3><p>Completed topics are saved on your device.</p></div></div><div class="footer">My Study Handbook • Curriculum-informed learning support • Original learning content<br>Not an official NaCCA publication. Topic-by-topic mapping to official indicators is still being developed.</div>`;
}
function searchAll(q){q=q.trim().toLowerCase();const box=document.getElementById('searchResults');if(!q){box.innerHTML='';return}let hits=[];for(const c in curriculum)for(const s in curriculum[c])curriculum[c][s].forEach(t=>{if((c+' '+s+' '+t).toLowerCase().includes(q))hits.push({c,s,t})});box.innerHTML=hits.length?`<div class="section-title"><h2>Search results</h2></div><div class="grid">${hits.slice(0,20).map(x=>`<div class="card" onclick="openTopic('${x.c}','${x.s}','${x.t.replace(/'/g,"\\'")}')"><b>${x.c}</b><p>${subjectMeta[x.s]?.icon||'📘'} ${x.s}</p><h3>${x.t}</h3></div>`).join('')}</div>`:`<div class="empty">No matching topic found.</div>`}
function selectClass(c){state.class=c;save();renderSubjects(c)}
function renderSubjects(c){document.getElementById('app').innerHTML=`<div class="breadcrumb"><span class="crumb" onclick="goHome()">Home</span> › <b>${c}</b></div><div class="hero"><h1>${c}</h1><p>Choose a subject to continue your study.</p></div><div class="grid">${Object.keys(curriculum[c]).map(s=>`<div class="card" onclick="renderTopics('${c}','${s}')"><div class="emoji">${subjectMeta[s].icon}</div><h3>${s}</h3><p class="muted">${subjectMeta[s].desc}</p><span class="pill">${curriculum[c][s].length} topics</span></div>`).join('')}</div>`}
function renderTopics(c,s){const topics=curriculum[c][s];const done=topics.filter(t=>state.progress[`${c}|${s}|${t}`]).length;document.getElementById('app').innerHTML=`<div class="breadcrumb"><span class="crumb" onclick="goHome()">Home</span> › <span class="crumb" onclick="renderSubjects('${c}')">${c}</span> › <b>${s}</b></div><div class="hero"><h1>${subjectMeta[s].icon} ${s}</h1><p>${subjectMeta[s].desc}</p><div class="progressbar"><span style="width:${done/topics.length*100}%"></span></div><small>${done} of ${topics.length} topics completed</small></div><div class="grid">${topics.map((t,i)=>{let key=`${c}|${s}|${t}`;return `<div class="card topic-card" onclick="openTopic('${c}','${s}','${t.replace(/'/g,"\\'")}')"><div class="topic-num">${i+1}</div><div style="flex:1"><h3>${t}</h3><p class="muted">Study notes • examples • application • practice</p><span class="pill">${state.progress[key]?'✓ Completed':'Start topic'}</span></div></div>`}).join('')}</div>`}
const authoredLessons = {
  "Primary 1|Mathematics|Numbers: Operations": {
    "concept": "Addition joins two or more groups. Subtraction tells us how many remain or how many more/less there are. At this level, use real objects, drawings, fingers and number lines before relying only on written symbols. The plus sign (+) means add; the minus sign (−) means subtract; the equals sign (=) means both sides have the same value. When solving a story problem, listen for what happens: are objects being joined, taken away, or compared? Count carefully and check by using the opposite operation where possible. For example, if 4 bottle tops and 3 more are joined, there are 7. If 7 are present and 3 are removed, 4 remain.",
    "examples": [
      "Addition: 3 mangoes + 2 mangoes = 5 mangoes. Count the first group, then count on two more: 4, 5.",
      "Subtraction: 6 pencils − 2 pencils = 4 pencils. Move two pencils away and count what remains.",
      "Check: 4 + 3 = 7, so 7 − 3 = 4. Addition and subtraction can help check each other."
    ],
    "real": "Children use addition and subtraction when sharing fruit, counting pupils, checking how many books are left, or finding how much money remains after buying something.",
    "activity": "Use 10 safe counters or bottle tops. Make a group of 4 and add 2. Draw the groups and write 4 + 2 = 6. Then start with 6, remove 2 and write 6 − 2 = 4. Ask a partner to make a story for each number sentence.",
    "mistakes": [
      "Adding when the story says objects were taken away. Act out the story before choosing the sign.",
      "Counting the first object twice when counting on. Start from the total already known.",
      "Writing a number sentence without checking whether the answer fits the story."
    ],
    "revision": "Addition joins groups; subtraction removes or compares. Use objects or drawings, write the matching number sentence, include the correct sign, and check your answer."
  },
  "Primary 1|Science|Materials and Their Properties": {
    "concept": "Objects are made from materials such as wood, metal, plastic, glass, paper, rubber, cloth and clay. A material has properties that we can observe, including colour, texture, hardness, flexibility, absorbency and whether light passes through it. We choose materials according to what an object needs to do. A raincoat should resist water; a towel should absorb water; a window should allow light through. Different objects may use the same material, and one object may contain several materials. Observe safely: do not taste unknown materials, touch hot objects, or handle broken glass.",
    "examples": [
      "A clear glass window lets light pass through; a wooden door usually does not.",
      "A sponge absorbs water, while a plastic sheet usually does not absorb it.",
      "A metal cooking pot transfers heat well, so it must be handled carefully when hot."
    ],
    "real": "People choose roofing, clothing, containers and school supplies based on strength, weight, water resistance, cost and safety.",
    "activity": "Collect or observe five safe classroom objects. Record each object, its material and two observable properties in a table. Predict which item would be most suitable for carrying water, then explain your choice using evidence. Do not break or burn any material.",
    "mistakes": [
      "Assuming every object that looks similar is made from the same material.",
      "Calling a material “best” without saying what job it must do.",
      "Testing materials in unsafe ways instead of observing or asking an adult."
    ],
    "revision": "Name the material, describe its observable properties, connect those properties to the object’s use, and follow safety rules during investigations."
  },
  "Primary 2|Mathematics|Numbers: Operations": {
    "concept": "Addition combines quantities and subtraction finds a difference or a remaining amount. Learners should solve with counters, drawings, number lines and number sentences. When adding, combine ones with ones and tens with tens. When subtracting, compare the quantities and take care with the order: 9 − 4 is not the same as 4 − 9 in ordinary whole-number work at this level. Story clues help, but the meaning of the situation matters more than one keyword. Check addition by subtracting and check subtraction by adding the difference to the amount taken away.",
    "examples": [
      "27 + 15: add ones, 7 + 5 = 12. Write 2 ones and regroup 1 ten. Then 2 tens + 1 ten + 1 regrouped ten = 4 tens. Answer: 42.",
      "43 − 18: regroup one ten as 10 ones. Then 13 − 8 = 5 and 3 tens − 1 ten = 2 tens. Answer: 25.",
      "Check 43 − 18 = 25 by adding 25 + 18 = 43."
    ],
    "real": "Operations help learners count attendance, add the cost of items, share materials, compare scores and work out what remains.",
    "activity": "Write three short stories: one about joining groups, one about taking away, and one comparing two amounts. Represent each with counters or drawings, write the number sentence and explain how you checked it.",
    "mistakes": [
      "Subtracting the smaller digit from the larger digit in every column without considering regrouping.",
      "Mixing tens and ones during written calculations.",
      "Using a keyword alone rather than understanding what happened in the story."
    ],
    "revision": "Represent the story, choose addition or subtraction, line up place values, regroup carefully when needed, and check using the opposite operation."
  },
  "Primary 3|Science|The Environment": {
    "concept": "The environment includes living things, non-living things and the surroundings in which they interact. Living things include plants, animals and people. Non-living components include air, water, soil, rocks and sunlight. A clean environment supports health and the survival of organisms. Poor disposal of rubbish can block drains, attract pests and pollute water. People can protect the environment by reducing waste, reusing suitable items, sorting rubbish, keeping drains clear and planting or caring for trees. Changes should be described using observations, not guesses alone.",
    "examples": [
      "After heavy rain, rubbish blocking a drain may cause water to overflow onto a road.",
      "Plants need suitable light, water, air and nutrients to grow; damaging vegetation can affect other organisms.",
      "A class can compare two nearby areas by recording visible litter, standing water and plant cover."
    ],
    "real": "Community sanitation, safe water, gardening, drainage and responsible waste disposal all depend on understanding the environment.",
    "activity": "With an adult or teacher, observe a safe part of the school compound. Record three things that help keep it clean and three problems that could be improved. Propose one realistic action and explain how the class could tell whether it worked.",
    "mistakes": [
      "Thinking the environment means only forests or wildlife. It includes places where people live and work.",
      "Claiming a cause without collecting observations.",
      "Handling unknown waste, sharp objects or dirty water during an activity."
    ],
    "revision": "The environment includes living and non-living components. Human actions can protect or harm it. Observe carefully, suggest practical actions and keep investigations safe."
  },
  "Primary 4|Mathematics|Whole Numbers Operations": {
    "concept": "Whole-number operations include addition, subtraction, multiplication and division. Place value helps organise written calculations. Multiplication can represent equal groups or repeated addition; division can represent sharing equally or finding how many groups fit. In multi-step problems, identify the question, list the useful facts, choose an order of operations and estimate before calculating. An estimate helps reveal answers that are unreasonable. For division, a remainder means some items are left over; the story determines whether to report the remainder, share it further, or round up to another group.",
    "examples": [
      "A school orders 24 exercise books for each of 6 classes. Total = 24 × 6 = 144 books.",
      "A farmer packs 156 oranges into bags of 12. 156 ÷ 12 = 13 bags because 12 × 13 = 156.",
      "A club has GH₵250 and spends GH₵85 on supplies and GH₵60 on transport. Remaining money = 250 − 85 − 60 = GH₵105."
    ],
    "real": "These operations are used for budgets, stocktaking, school supplies, transport planning, farming and sharing resources fairly.",
    "activity": "Create a small class-shop list with four items and realistic whole-number quantities and prices. Write one addition problem, one subtraction problem, one multiplication problem and one division problem. Estimate each answer, calculate exactly and compare.",
    "mistakes": [
      "Choosing operations before understanding the story.",
      "Ignoring place-value alignment or regrouping.",
      "Forgetting to interpret a remainder in context.",
      "Not estimating or checking the final answer."
    ],
    "revision": "Use place value; know what each operation represents; plan multi-step calculations; estimate first; check with an inverse operation; state units and interpret remainders."
  },
  "Primary 4|Science|Diversity of Matter": {
    "concept": "Matter is anything that has mass and occupies space. It can be found as a solid, liquid or gas. Solids usually keep their shape; liquids flow and take the shape of their container; gases spread to fill available space. Materials can be classified by observable properties such as colour, texture, hardness, flexibility, transparency, solubility and ability to conduct heat or electricity. A property is useful when it helps explain why a material is selected for a particular job. Changes such as melting or freezing can change a material’s state without necessarily making a new substance.",
    "examples": [
      "Ice melts into liquid water when it gains heat; cooling water can make it freeze.",
      "A metal spoon is useful for stirring because it is strong, but it may become hot in hot food.",
      "Salt dissolves in water under suitable conditions, while sand does not dissolve in the same way."
    ],
    "real": "Builders, cooks, farmers and manufacturers choose materials based on properties, cost, availability and safety.",
    "activity": "Observe a small amount of water, an ice cube and a solid object such as a stone. Describe their shape and how they behave in a container. If permitted, compare how salt and sand behave in separate cups of water; do not taste the mixtures and wash hands afterward.",
    "mistakes": [
      "Saying that a gas is “nothing”; gases are matter even when invisible.",
      "Assuming dissolving always means a substance has disappeared.",

    "revision": "Matter has mass and occupies space. Solids, liquids and gases behave differently. Classify materials using evidence about their properties and use safe tests."

  "Primary 5|Mathematics|Fractions Representation and Relationship": {

function topicContent(c,s,t){
 const authored = authoredLessons[`${c}|${s}|${t}`];
 if(authored) return authored;
 const key=t.toLowerCase();
 // Fully authored exemplar lesson: detailed, age-appropriate and usable offline.
 if(c==='Primary 1' && s==='Mathematics' && t==='Numbers: Counting, Representation and Cardinality'){
  return {
   concept:`Numbers help us answer “how many?” and describe order. Counting means saying number names in the correct order while matching one number name to one object. If we count bottle tops as “one, two, three, four, five”, the last number said—five—tells us the total number of bottle tops. This is called cardinality.\n\nA number can be shown in different ways: real objects, a drawing, fingers, a numeral (such as 5), or a number word (“five”). These are different representations of the same amount. When counting, move each object into a separate group or touch each object once so that you do not count it twice or miss it.\n\nNumbers can also show order. For example, a pupil may be first in a line, another second, and another third. “How many pupils?” asks for a total; “which pupil is first?” asks about position.\n\nA number line helps us see numbers in order. Numbers become greater as we move to the right and smaller as we move to the left. Learners should practise counting forward and backward, matching a group to a numeral, and explaining how they know the total.`,
   examples:[`**Example 1 — Count objects:** Put 6 bottle tops on a desk. Touch one top for each number word: 1, 2, 3, 4, 5, 6. There are 6 bottle tops because 6 was the last number counted.`,`**Example 2 — Match a numeral:** Draw four circles: ○ ○ ○ ○. The group has 4 circles, so match it to the numeral **4** and the word **four**.`,`**Example 3 — Compare groups:** Group A has 3 pencils and Group B has 5 pencils. Match the pencils one-to-one. Group B has 2 more pencils because two pencils remain unmatched in Group B.`,`**Example 4 — Count backwards:** Start at 5 and count backwards: 5, 4, 3, 2, 1. This helps prepare for subtraction and understanding number order.`],
   real:`Counting is useful when sharing mangoes with friends, checking how many books are in a school bag, counting eggs at a market, checking the number of pupils present, or counting money. Counting carefully helps people avoid mistakes when sharing or recording quantities.`,
   activity:`**Bottle-top counting game**\n1. Collect 10 clean bottle tops or safe counters.\n2. Put 3 on the table. Touch each one as you count.\n3. Show the numeral card for 3 or write the number 3.\n4. Add one counter at a time and say the new total.\n5. Remove one at a time and count backwards.\n6. Ask a partner to arrange 4, 7 and 2 counters; count each group and check the matching numeral.\n7. Draw one group and write the numeral beside it. Do not put small objects in your mouth; use adult supervision where needed.`,
   mistakes:['Saying number names correctly but touching the same object twice. Move each counted object to a separate space.','Thinking the last object counted is the only object that matters. The last number word gives the total of the whole group.','Matching a numeral to a group without counting carefully. Count and check one-to-one.','Confusing a total (“five books”) with an order (“fifth in line”). Ask whether the question is “how many?” or “which position?”.'],
   revision:`• Count in the correct order.\n• Match one number word to one object.\n• The last number counted tells the total (cardinality).\n• A quantity can be shown with objects, drawings, numerals and number words.\n• Numbers have an order on a number line.\n• Count again to check if you are unsure.`,
   detailed:true
  };
 }
 const math=s==='Mathematics', sci=s==='Science', comp=s==='Computing';
 let concept,examples,activity,real,mistakes,revision;
 if(math){
  const specific={
   'numbers: counting, representation and cardinality':['Numbers tell us how many or how much. Counting means saying number names in order and matching each number with one object. Cardinality is the idea that the last number counted tells the total number in the collection. Learners should connect numerals, number words, objects, drawings and number lines.','A teacher places 7 bottle tops on a table. Count them once, touch each object only once, then state the total: 7.','A shopkeeper counts sachets, a parent counts money and a pupil counts books before sharing them.'],
   'whole numbers: counting and representation':['Whole numbers can be represented with numerals, words, place-value charts, bundles, counters and number lines. Place value tells the value of a digit according to its position.','In 4,582, the 4 represents 4 thousands, 5 represents 5 hundreds, 8 represents 8 tens and 2 represents 2 ones.','Place value helps when reading prices, population figures, examination scores and quantities in a shop or store.'],
   'number and numeration systems':['A number system gives rules for representing and working with quantities. In the decimal system, place value is based on powers of ten. Learners should read, compare, order and represent numbers accurately.','Compare 3,405 and 3,450 by checking digits from the highest place value to the lowest.','Number representation is used in money, phone numbers, measurements, dates and records.'],
   'real numbers':['Real numbers include rational and irrational numbers and can be represented on a number line. Learners should distinguish exact values from approximations and use appropriate operations.','Place √2 between 1 and 2 because 1²<2<2². A decimal approximation can then be used when needed.','Measurements, distances, rates and scientific calculations often require exact values or sensible approximations.'],
   'fractions, decimals and percentages':['Fractions, decimals and percentages are different ways of representing parts of a whole. A learner should move between forms and choose the form that makes a problem easier to solve.','25/100 = 0.25 = 25%. Therefore a GH₵200 item discounted by 25% is reduced by GH₵50.','Discounts, examination scores, savings, interest and statistics commonly use percentages.'],
   'ratio and proportion':['A ratio compares quantities using the same units. Proportion describes an equality between ratios or a consistent relationship between quantities.','If 2 cups of rice serve 5 people, keeping the same proportion means 4 cups serve 10 people.','Recipes, map scales, mixtures, sharing and currency calculations use proportional reasoning.'],
   'ratio, proportion and rates':['A rate compares quantities with different units, such as kilometres per hour or cedis per kilogram. Proportion helps maintain a consistent relationship when quantities change.','If a taxi travels 120 km in 3 hours, its average speed is 40 km/h.','Transport fares, fuel use, wages, prices per unit and internet data bundles involve rates.'],
   'financial mathematics':['Financial mathematics applies number skills to money decisions such as profit, loss, discount, simple interest, budgeting and savings.','If an item costs GH₵80 and is sold for GH₵100, the profit is GH₵20. Profit percentage is calculated relative to cost price.','A learner can use financial mathematics to compare prices, plan savings and evaluate a small business decision.']
  };
  const d=specific[key]||[`${t} develops mathematical understanding by connecting representations, procedures, reasoning and real-life problem solving. Learners should identify the information given, choose an appropriate method, show working clearly and check whether the result is reasonable.`,`Start with a simple example of ${t}, represent the information using numbers, words, a table or diagram, then solve it step by step and explain the answer.`,`The ideas in ${t} can be used in home budgeting, shopping, measurement, planning, construction, transport, school records and everyday decision-making.`];
  concept=d[0]; examples=[d[1],`Change one part of the example and predict what should happen before calculating. Explain why your prediction is reasonable.`,`Create your own example involving ${t}. Write the known information, the unknown, the method, the working and a final check.`]; real=d[2]; activity=`Collect or create a small set of real-life information related to ${t}. Represent it clearly, solve at least one problem with it and explain your reasoning to another learner.`; mistakes=['Choosing an operation before understanding what the question asks.','Dropping units, signs, place values or important conditions.','Giving an answer without checking whether it is reasonable.']; revision=`Remember the key idea in ${t}; identify what is known and unknown; choose a representation or method; show each important step; check the result; explain it in words.`;
 } else if(sci){
  const specific={
   'diversity of matter':['Matter is anything that has mass and occupies space. Materials differ in properties such as hardness, texture, solubility, transparency, conductivity and state. Classifying materials by observable or measurable properties helps us choose suitable materials for particular uses.','Compare a metal spoon, wooden stick and plastic ruler. Their properties make them useful for different purposes.','Cooking utensils, building materials, packaging and household objects are selected according to their properties.'],
   'cycles':['A cycle is a sequence of events that repeats in a predictable pattern. Natural cycles such as the water cycle and life cycles help explain changes in the environment and living things.','Water can evaporate, condense into clouds and return as precipitation before collecting again.','Understanding cycles supports farming, water conservation, weather interpretation and environmental care.'],
   'systems':['A system consists of connected parts that work together to perform a function. A change in one part can affect other parts.','The digestive system contains organs that work together to break down food and absorb nutrients.','Machines, ecosystems and body systems all show how connected parts can work together.'],
   'forces and energy':['A force is a push or pull that can change motion or shape. Energy is the ability to cause change or do work. Forces and energy are involved in movement, machines, electricity, heating and many everyday processes.','Pushing a wheelbarrow applies a force that changes its motion. Friction can oppose the movement.','Transport, sports, machines, electricity use and household appliances all involve forces and energy.'],
   'human body and health':['The human body is made of interacting systems that support life. Good health depends on nutrition, hygiene, physical activity, rest, safety and prevention of disease.','Regular handwashing can reduce the transfer of harmful microorganisms. A balanced diet supplies different nutrients needed by the body.','Clean water, sanitation, food choices, exercise and preventive health practices affect individuals and communities.'],
   'health and disease':['Health is influenced by biological, environmental and behavioural factors. Diseases may be infectious or non-infectious, and prevention often involves hygiene, immunisation, healthy habits and environmental management.','If several people become ill after drinking contaminated water, investigating the water source can help identify a possible cause.','Safe water, sanitation, food hygiene, mosquito control and appropriate medical care are important in communities.'],
   'environment and sustainability':['An environment contains living and non-living components that interact. Sustainability means using resources in ways that meet present needs without unnecessarily damaging future opportunities.','Reducing plastic waste, protecting vegetation and using water carefully can reduce environmental pressure.','Waste management, farming, energy use, water conservation and community sanitation are practical sustainability issues.'],
   'earth and space':['Earth is part of a larger system that includes the Sun, Moon and other celestial bodies. Observing patterns such as day and night and apparent movements in the sky helps learners build scientific explanations.','Day and night result from Earth rotating on its axis. The Moon appears to change shape because we see different portions of its illuminated side.','Calendars, seasons, navigation, agriculture and weather observations connect people with Earth and space science.']
  };
  const d=specific[key]||[`${t} is studied through observation, evidence, explanation and application. Learners should connect the concept to things that can be observed at home, at school or in the Ghanaian environment.`,`Begin with an observation related to ${t}. Record what you see or measure, suggest an explanation, then identify evidence that could support or challenge the explanation.`,`Knowledge of ${t} can help people make safer, healthier and more environmentally responsible decisions.`];
  concept=d[0]; examples=[d[1],`Describe one observation related to ${t}, then separate what you observed from the explanation you propose.`,`Plan a simple, safe investigation connected to ${t}. State the question, prediction, variables or conditions, observations and conclusion.`]; real=d[2]; activity=`Carry out a safe observation or mini-investigation related to ${t}. Record evidence in a table or labelled drawing, then write a conclusion that is supported by the evidence.`; mistakes=['Confusing an observation with an explanation.','Changing too many conditions at once when investigating cause and effect.','Making a conclusion that is stronger than the evidence allows.']; revision=`Use the science sequence: observe → ask → predict → investigate → record evidence → explain → conclude → communicate.`;
 } else {
  const specific={
   'introduction to computing':['Computing involves using digital systems to represent, process, store and communicate information. A computer system includes hardware, software, data and people working together.','Identify the monitor, keyboard, mouse and system unit, then explain the role of each.','Schools, shops, banks, hospitals and homes use computing systems to store information, communicate and complete tasks.'],
   'data and information':['Data are raw facts or observations. Information is data that has been processed or organised so that it becomes meaningful and useful for decisions.','A list of daily sales is data; a weekly total and chart showing the best-selling item turn that data into useful information.','Schools, businesses and public services use data to plan, monitor performance and make decisions.'],
   'algorithms and programming':['An algorithm is a clear sequence of steps for solving a problem or completing a task. Programming expresses instructions in a form a computer can execute.','To calculate an average: input scores, add them, count the scores, divide the total by the count and display the result.','Algorithms help with recipes, troubleshooting, school processes, apps, websites and automated systems.'],
   'cybersecurity':['Cybersecurity protects devices, accounts, networks and information from unauthorised access, misuse, damage or disruption. Good security combines strong passwords, updates, careful sharing and safe online behaviour.','A strong password should be difficult to guess, and a learner should avoid sharing passwords or clicking suspicious links.','Banking, school accounts, social media and business systems all require responsible protection of digital information.'],
   'digital citizenship':['Digital citizenship means using technology safely, responsibly, respectfully and ethically. It includes privacy, digital footprints, communication, intellectual property and responsible participation online.','Before posting a photo of another person, ask whether you have permission and whether sharing it could cause harm.','Responsible digital behaviour protects relationships, reputation, privacy and community trust.']
  };
  const d=specific[key]||[`${t} develops digital literacy and computational problem solving. Learners should understand the concept, practise it using appropriate tools and consider safety, privacy and responsible use.`,`Break a task involving ${t} into smaller steps. Identify the input, process and expected output, then test whether the result is correct.`,`The skill can be applied to schoolwork, communication, record keeping, business, research and everyday digital tasks.`];
  concept=d[0]; examples=[d[1],`Create a small school or community problem that could be improved using ${t}. Describe the input, process, output and how you would test the solution.`,`Explain one safety, privacy or ethical issue that a learner should consider when using ${t}.`]; real=d[2]; activity=`Design a small digital task related to ${t}. Write the steps before using a device, test the result, identify one problem and explain how you would improve it.`; mistakes=['Using a tool without understanding the task it is meant to solve.','Ignoring privacy, security or responsible-use considerations.','Failing to test a digital result before relying on it.']; revision=`Remember: define the problem → plan the steps → choose the tool → create or perform → test → correct → use responsibly.`;
 }
 return {concept,examples,activity,real,mistakes,revision};
}

function makeQuestions(c,s,t){
 const qs=[];
 const levelFor=i=>i<=10?'Understand':i<=25?'Apply':i<=40?'Reason':'Challenge';
 const contexts=['home','school','a market','a farm','a community event','a small business','a clinic','a transport situation','a sports activity','an environmental project'];
 const grade=c==='Primary 1'?1:c==='Primary 2'?2:c==='Primary 3'?3:c==='Primary 4'?4:c==='Primary 5'?5:c==='Primary 6'?6:c==='JHS 1'?7:c==='JHS 2'?8:9;
 const mathBank=[
  ['Explain the main idea of this topic in your own words. Give one example using objects or numbers.','A pupil has 12 items and receives 5 more. Show a way to represent the situation and find the total.','A class has 18 learners. They are arranged equally into 3 groups. How many learners are in each group? Show your reasoning.','A shop displays two quantities or prices related to this topic. Explain how you would compare them fairly.','Create a real-life problem involving this topic and solve it, showing each step.'],
  ['Identify the information given and what needs to be found. Which method is suitable, and why?','A family buys items costing GH₵12 and GH₵8, then pays GH₵25. How much change should they receive?','A farmer packs 24 oranges equally into 4 baskets. How many oranges go in each basket? Explain how you can check.','A learner gets a different answer from yours. Describe two checks you would use to find the error.','Change one number in the situation and explain how the answer changes.'],
  ['Compare two possible methods for solving a problem in this topic. Which is more efficient and why?','A school needs to share resources fairly among classes. Design a calculation or representation to support the decision.','Write a two-step word problem using this topic, then solve it.','Explain a common mistake a learner might make and show how to correct it.','Create a table or diagram to organise the information before solving the problem.'],
  ['A community member makes a claim about a quantity or result. What calculation or evidence would you use to test the claim?','Plan a solution to a problem with at least two steps. Explain why the order of your steps matters.','Find a second method for solving a problem in this topic and compare the results.','Write a challenging word problem that uses this topic and provide a worked solution.','Explain how the result could help someone make a practical decision.']
 ];
 const scienceBank=[
  ['State one important idea about this topic and give an example you can observe nearby.','Describe what you would observe if you investigated this topic at home or school.','Make a prediction about a simple situation related to this topic and explain your reason.','Name one safety rule to follow during an activity related to this topic.','Draw or describe a labelled model that could help a younger learner understand the idea.'],
  ['A change or problem related to this topic is noticed in the community. What observations would you record first?','Suggest a fair test or safe investigation. What will you change, what will you observe and what will you keep the same?','Give two possible explanations for an observation. What evidence would help you choose between them?','Explain how this topic connects to health, farming, weather or the local environment.','Describe one action people could take using this scientific knowledge.'],
  ['A friend makes a scientific claim about this topic. What evidence would you ask for before accepting it?','Plan an investigation with a question, prediction, materials, method, results table and conclusion.','Explain how a change in one part of a system could affect another part.','Compare two explanations and identify which is better supported by evidence.','Suggest an improvement that would make an investigation more reliable or fair.'],
  ['Analyse a real community problem related to this topic and identify the scientific ideas needed to understand it.','Design a safe investigation to test a claim. Identify variables, controls, measurements and possible sources of error.','Explain what conclusion is justified by a set of observations and what cannot yet be concluded.','Evaluate two possible solutions using evidence, safety, cost and environmental impact.','Communicate a scientific recommendation to the community and justify it with evidence.']
 ];
 const compBank=[
  ['Explain the key term in this topic and give one example of how a learner might use it.','List the steps you would follow to complete a small task related to this topic.','What could go wrong when completing the task, and how would you notice?','Name one way to protect personal information while doing this task.','Explain the difference between a useful digital tool and using a tool without a clear purpose.'],
  ['A teacher needs to complete a task using this topic. Identify the input, steps/process and expected output.','Break a task into smaller steps and put them in the correct order.','Describe how you would test the result and correct an error.','A classmate suggests sharing a password or private information. Explain the risk and a safer choice.','Suggest a digital solution to a school or community need and explain its benefits and limitations.'],
  ['Compare two ways to complete a digital task. Which is more reliable, accessible or efficient? Explain.','Write an algorithm in numbered steps or pseudocode for a task related to this topic.','Describe a test case that could reveal an error and explain what you would do if it fails.','Identify a privacy, security, copyright or fairness issue in a realistic scenario and propose a response.','Explain how you would improve a digital product after receiving user feedback.'],
  ['Analyse a digital problem, identify its users and requirements, and propose a solution.','Design an algorithm or workflow, then test it with at least two different examples.','Explain how you would protect data and respect users when implementing the solution.','Evaluate the solution using accuracy, usability, accessibility, safety and efficiency.','Propose an improvement and justify it with evidence from testing or user feedback.']
 ];
 const bank=s==='Mathematics'?mathBank:s==='Science'?scienceBank:compBank;
 const authoredStems=authoredQuestionStems[`${c}|${s}|${t}`];
 const tier=i=>i<=10?0:i<=25?1:i<=40?2:3;
 for(let i=1;i<=50;i++){
   const tierIndex=tier(i), context=contexts[(i-1)%contexts.length];
   const stem=authoredStems ? authoredStems[(i-1)%authoredStems.length] : bank[tierIndex][(i-1)%bank[tierIndex].length];
   const prompts=[
    `Question ${i} • ${levelFor(i)}: ${stem} Topic: ${t}.`,
    `Question ${i} • ${levelFor(i)}: In ${context}, a situation involving ${t} occurs. ${stem}`,
    `Question ${i} • ${levelFor(i)}: Use a Ghanaian home, school or community example to answer this: ${stem} Focus: ${t}.`,
    `Question ${i} • ${levelFor(i)}: Think critically about ${t}. ${stem}`
   ];
   const q=prompts[(i-1)%prompts.length];
   let a;
   if(s==='Mathematics') a=`Marking guide: (1) identify the relevant mathematical idea; (2) select a suitable representation or operation; (3) show correct working; (4) state the answer with units where needed; (5) check the answer or explain why it is reasonable. For open-ended tasks, accept any correct method supported by clear reasoning.`;
   else if(s==='Science') a=`Marking guide: credit a relevant scientific concept, a clear observation or prediction, a safe and fair method where an investigation is requested, evidence that supports the explanation, and a conclusion that does not go beyond the evidence. Accept other scientifically sound explanations.`;
   else a=`Marking guide: credit a clear understanding of the concept, logical steps or an appropriate tool, a way to test the result, identification of likely errors, and responsible attention to privacy, safety and ethics where relevant. Accept alternative solutions that meet the task requirements.`;
   qs.push({q,a});
 }
 return qs;
}
function openTopic(c,s,t){const data=topicContent(c,s,t);const key=`${c}|${s}|${t}`;const questions=makeQuestions(c,s,t);document.getElementById('app').innerHTML=`<div class="breadcrumb"><span class="crumb" onclick="goHome()">Home</span> › <span class="crumb" onclick="renderSubjects('${c}')">${c}</span> › <span class="crumb" onclick="renderTopics('${c}','${s}')">${s}</span> › <b>${t}</b></div><article class="lesson"><h1>${t}</h1><div class="chips"><span class="pill">${c}</span><span class="pill">${s}</span><span class="pill">Curriculum-informed</span></div><section><h2>📖 Study Notes</h2><p>${data.concept}</p><div class="note"><b>Study approach:</b> Do not memorise isolated facts only. Connect the idea to examples, explain it in your own words and practise using it in unfamiliar situations.</div></section><section><h2>✏️ Worked Approach & Examples</h2>${data.examples.map((x,i)=>`<div class="example"><b>Example ${i+1}</b><br>${x}</div>`).join('')}<div class="diagram">${s==='Mathematics'?'Known information → Method/Representation → Working → Answer → Check':s==='Science'?'Observation → Question → Prediction → Investigation → Evidence → Conclusion':'Problem → Plan → Tool/Algorithm → Test → Improve → Responsible use'}</div></section><section><h2>🌍 Real-Life Application</h2><p>${data.real}</p></section><section><h2>🧪 Practical Activity</h2><p>${data.activity}</p></section><section><h2>⚠️ Common Mistakes</h2><div class="mistake"><ul>${data.mistakes.map(x=>`<li>${x}</li>`).join('')}</ul></div></section><section><h2>🧠 Quick Revision</h2><p>${data.revision}</p></section><section><h2>📝 50 Application Questions</h2><p class="muted">Questions are arranged from understanding to application, reasoning and challenge. Use your exercise book for working.</p>${questions.map(x=>`<div class="question"><strong>${x.q}</strong><button class="btn btn-outline" onclick="this.nextElementSibling.classList.toggle('hidden')">Show marking guide</button><div class="answer hidden">${x.a}</div></div>`).join('')}</section><div class="actions"><button class="btn btn-primary" onclick="completeTopic('${key.replace(/'/g,"\\'")}')">${state.progress[key]?'✓ Completed':'Mark Topic Complete'}</button><button class="btn btn-outline" onclick="renderTopics('${c}','${s}')">Back to Topics</button></div></article><div class="footer">Use this handbook alongside your teacher's lessons, approved learning materials and school assessments.</div>`}

const handbookTopicProfiles = {
 Mathematics: [
  {match:/counting|cardinality|whole numbers|number and numeration|real numbers|number line/i, name:'number sense and representation', concept:'Number sense means understanding what numbers represent, how they are ordered and how their values can be compared. Represent numbers with objects, drawings, words, numerals, place-value charts and number lines. Place value depends on the position of each digit. Estimate first, calculate carefully, and check whether the result is sensible.', ex:'Represent 3,406 in a place-value chart: 3 thousands, 4 hundreds, 0 tens and 6 ones. Compare 3,406 with 3,460 by comparing digits from left to right; 3,460 is greater.', activity:'Collect 20 safe objects such as bottle tops. Group them into tens and ones, draw the groups, write the numeral and explain how the groups show the number.', real:'Number sense is used when counting pupils, reading prices, recording scores, estimating journey distances and checking money received.'},
  {match:/operations|addition|subtraction|multiplication|division|problem solving/i, name:'operations and problem solving', concept:'Operations are tools for answering questions about quantities. Addition combines or increases quantities; subtraction finds a difference or what remains; multiplication represents equal groups; division shares equally or measures how many groups fit. A word problem may need more than one operation, so identify the question before choosing a method.', ex:'A class collects 28 cans on Monday and 17 on Tuesday. Total = 28 + 17 = 45 cans. If 12 are recycled, 45 − 12 = 33 cans remain.', activity:'Write a two-step shopping problem using three prices. Estimate the total first, calculate it, then compare the answer with your estimate.', real:'Operations help with budgeting, sharing resources, calculating stock, planning events and checking transactions.'},
  {match:/fraction|decimal|percentage|percent/i, name:'fractions, decimals and percentages', concept:'Fractions, decimals and percentages describe parts of a whole or a ratio. The denominator tells how many equal parts make the whole and the numerator tells how many parts are considered. Equivalent fractions have the same value. A percentage means “out of 100”. Convert forms only after identifying the whole or base amount.', ex:'3/4 = 75/100 = 75%. To find 25% of GH₵80, calculate 0.25 × 80 = GH₵20.', activity:'Divide a paper rectangle into equal parts. Shade one fraction, write an equivalent fraction and decimal where appropriate, and explain how you know the values match.', real:'These ideas are used in discounts, examination results, recipes, savings, survey results and sharing quantities fairly.'},
  {match:/ratio|proportion|rate/i, name:'ratio, proportion and rates', concept:'A ratio compares quantities. Write quantities in the same units before simplifying a ratio. Proportion describes an equivalent relationship, while a rate compares quantities measured in different units, such as kilometres per hour or cedis per kilogram. Check that any scaling keeps the relationship consistent.', ex:'If 2 cups of rice serve 5 people, doubling the recipe gives 4 cups for 10 people. A car travelling 150 km in 3 hours has an average speed of 50 km/h.', activity:'Use a simple drink or recipe example to scale quantities for twice as many people. Show the original ratio, the scale factor and the new quantities.', real:'Ratio and rates are useful in recipes, maps, transport, unit pricing, mixtures and comparing data bundles.'},
  {match:/pattern|relationship|function|unknown|expression|equation|inequalit|algebra|formula|graph/i, name:'patterns, algebra and relationships', concept:'A pattern follows a rule. Algebra uses symbols to represent numbers or quantities that may be unknown or changing. An expression describes a calculation; an equation states that two expressions are equal. Solve equations by keeping both sides balanced, and check a solution by substituting it back into the original statement.', ex:'For the sequence 4, 7, 10, 13, the rule is “add 3”; the next term is 16. For x + 5 = 12, subtract 5 from both sides to get x = 7, then check 7 + 5 = 12.', activity:'Create a growing pattern using matchsticks or dots. Record the number in each stage, describe the rule in words and, at an appropriate level, write a rule using a variable.', real:'Patterns and algebra support planning, coding, calculating unknown costs and describing relationships in science.'},
  {match:/line|shape|geometry|transformation|measurement|length|area|perimeter|volume|angle|geometrical/i, name:'geometry and measurement', concept:'Geometry studies shapes, positions, space and properties. Measurement compares an attribute with a standard unit. Choose appropriate units and tools, estimate before measuring, label answers, and distinguish perimeter (distance around a shape) from area (surface covered) and volume (space occupied). Geometric reasoning uses properties and clear diagrams rather than appearance alone.', ex:'A rectangle 8 cm long and 3 cm wide has perimeter 2(8 + 3) = 22 cm and area 8 × 3 = 24 cm². The units differ because perimeter measures length and area measures surface.', activity:'Measure a desk or book with a ruler or tape. Record length and width, estimate first, calculate the perimeter or area if suitable, and explain possible measurement errors.', real:'Measurement and geometry are used in construction, sewing, farming, packaging, maps, sports and arranging furniture.'},
  {match:/data|statistics|probability|chance/i, name:'data, statistics and chance', concept:'Data are collected to answer a question. Organise data in tables, tally charts, pictographs, bar charts or other suitable displays. Read titles, labels, scales and units carefully. The mean is the total divided by the number of values; the median is the middle value after ordering; the mode is the most frequent value. Probability describes how likely an event is.', ex:'Scores 2, 4, 4, 6 have mean (2+4+4+6)/4 = 4, median (4+4)/2 = 4 and mode 4. A fair coin has two equally likely outcomes, so the chance of heads is 1/2.', activity:'Ask ten classmates a simple, non-sensitive question such as their preferred fruit. Record tally marks, draw a chart and write two conclusions supported by the data.', real:'Data skills help schools review attendance, communities plan services, and families compare prices or understand weather reports.'},
  {match:/financial|money|profit|loss|interest|budget|saving/i, name:'financial mathematics', concept:'Financial mathematics helps people make informed money decisions. Keep cost price, selling price, profit, loss, discount, savings and interest distinct. Profit = selling price − cost price; loss = cost price − selling price. A percentage is calculated from the stated base amount. A budget compares expected income with planned spending.', ex:'An item bought for GH₵60 and sold for GH₵75 gives a profit of GH₵15. If a GH₵100 item has a 10% discount, the discount is GH₵10 and the sale price is GH₵90.', activity:'Prepare a pretend budget for a class activity with a fixed amount of money. List costs, calculate the total and explain one change that would keep spending within the budget.', real:'These calculations support saving, shopping, small businesses, mobile-money checks and comparing offers.'}
 ],
 Science: [
  {match:/diversity of matter|material|matter|substance|mixture|separation|property|state of/i, name:'matter, materials and their properties', concept:'Matter has mass and occupies space. Materials can be described and compared by observable or measurable properties such as state, colour, texture, hardness, solubility, transparency and ability to conduct heat or electricity. Classification should use evidence and a stated rule. A change in appearance does not always mean a new substance has formed.', ex:'Sand and iron filings can be separated with a magnet because iron is magnetic and sand is not. Salt dissolved in water can be recovered by evaporating the water carefully under adult supervision.', activity:'Compare safe household materials by texture, flexibility, transparency and whether they absorb water. Record observations in a table. Do not taste materials or heat unknown substances.', real:'Material properties help people choose roofing, cooking utensils, clothing, packaging and building materials suitable for a purpose.'},
  {match:/cycle|water cycle|life cycle|reproduction|growth|germination/i, name:'cycles and life processes', concept:'A cycle is a sequence of stages that repeats. In the water cycle, water evaporates, condenses, falls as precipitation and collects or flows back into water bodies. Living things also pass through life-cycle stages; the stages differ among organisms. Evidence from observations helps explain how conditions affect growth and change.', ex:'A wet cloth dries faster in warm, moving air because evaporation occurs more quickly. A seed may germinate when it has suitable water, air and warmth, though different seeds have different needs.', activity:'Observe a damp cloth in a safe place and record how its wetness changes over time. Alternatively, observe a seed in moist cotton and record changes daily without claiming all seeds grow at the same speed.', real:'Knowledge of cycles helps with water conservation, farming, gardening, sanitation and understanding seasonal changes.'},
  {match:/system|human body|digest|respirat|circulator|skeleton|organ|nutrition|healthy living/i, name:'systems and the human body', concept:'A system contains parts that work together. Body systems perform related functions and depend on one another: digestion makes nutrients available, breathing supplies oxygen, circulation transports materials, and excretion removes certain wastes. Health is supported by balanced nutrition, clean water, hygiene, exercise, sleep and appropriate medical care.', ex:'During exercise, muscles need more oxygen and energy, so breathing and heart rate usually increase. Washing hands with soap helps remove germs and interrupts routes by which infection can spread.', activity:'Measure your pulse at rest, do gentle movement if safe, then measure again after stopping. Record the difference and explain why a body response may change; do not treat this activity as a medical diagnosis.', real:'Understanding body systems helps learners make choices about hygiene, nutrition, physical activity and disease prevention.'},
  {match:/force|energy|motion|electric|magnet|light|sound|heat|machine/i, name:'forces, energy and physical processes', concept:'A force is a push or pull that can change an object’s speed, direction or shape. Energy is transferred or transformed in processes such as heating, lighting and movement. Friction can oppose motion; gravity pulls objects towards Earth. Electricity and heat require particular safety precautions, and investigations should use safe, low-risk materials.', ex:'A rolling ball slows because forces such as friction and air resistance oppose its motion. In a torch, chemical energy in the battery is transferred electrically and becomes light and heat.', activity:'Roll the same toy car across two safe surfaces and compare how far it travels. Keep the starting point and push as similar as possible; repeat trials and record results.', real:'Forces and energy are involved in transport, sports, tools, appliances, lighting and cooking.'},
  {match:/environment|sustainab|pollution|sanitation|ecosystem|habitat|food chain|food web|plants and animals|living things/i, name:'living things and the environment', concept:'Living things carry out life processes and interact with one another and with non-living components such as water, air, soil and sunlight. A habitat provides the conditions and resources an organism needs. Food chains show how energy passes between organisms. Pollution and habitat destruction can affect organisms and people; sustainable actions reduce avoidable harm.', ex:'Grass may be eaten by a grasshopper, which may be eaten by a frog. If one population changes greatly, other organisms in the food chain may also be affected.', activity:'Observe a school garden or safe outdoor area. Record examples of living and non-living things, describe one interaction and suggest one way to protect the habitat.', real:'This knowledge supports sanitation, farming, biodiversity protection, waste reduction and responsible use of local resources.'},

function resetChoiceQuiz(){sessionStorage.removeItem('mshQuizAnswers');document.querySelectorAll('[data-choice-question] input[type=radio]').forEach(el=>el.checked=false);document.querySelectorAll('[id^=feedback-]').forEach(el=>{el.className='answer';el.textContent='Choose an answer to check your understanding.'});const scoreEl=document.getElementById('quizScore');if(scoreEl)scoreEl.textContent='Answered: 0 / 50 • Correct: 0';}
function submitChoiceQuestion(id,selected){
 const q=window.choiceQuestionMap?.[id]; if(!q)return;
 const box=document.getElementById('feedback-'+id); const correct=Number(selected)===q.correct;
 box.className='answer'; box.innerHTML=`<b style="color:${correct?'#047857':'#b91c1c'}">${correct?'Correct! Well done.':'Not quite.'}</b> ${correct?'':`Correct answer: ${String.fromCharCode(65+q.correct)}. ${q.options[q.correct]}. `}${q.explanation}`;
 const prev=JSON.parse(sessionStorage.getItem('mshQuizAnswers')||'{}'); if(!(id in prev))prev[id]=correct; else prev[id]=correct; sessionStorage.setItem('mshQuizAnswers',JSON.stringify(prev));
 const all=document.querySelectorAll('[data-choice-question]'); let answered=0,score=0; all.forEach(el=>{const a=prev[el.dataset.choiceQuestion];if(a!==undefined){answered++;if(a)score++;}});
 const scoreEl=document.getElementById('quizScore'); if(scoreEl)scoreEl.textContent=`Answered: ${answered} / ${all.length} • Correct: ${score}`;
}
